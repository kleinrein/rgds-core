name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Same platform the test suite is run on day to day; nothing here builds the launcher or the engines.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v7
        with:
          go-version-file: flasher/go.mod
          # the flasher has no dependencies, so no go.sum to key a cache on
          cache: false
      - name: Python syntax
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile
      - name: Python tests
        # In parallel, one process per test class; leaves out the needs-build, slow and known-red modules listed
        # in tools/test.py (take a module out of known_red there once it is fixed)
        run: python tools/test.py --ci
      - name: Flasher vet
        working-directory: flasher
        run: go vet ./...
      - name: Flasher tests
        working-directory: flasher
        run: go test ./...
