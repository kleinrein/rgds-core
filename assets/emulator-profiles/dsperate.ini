# RGDS DSperate base profile. User files remain writable and are preserved.
# Keys are verified against upstream DSperate 1b76c355109c9f7576363ccc023927b3137d3c6f.
# Use the SDL renderer while RGDS owns the shared pause overlay.
[video]
dual_window = true
fullscreen = true
sink = renderer
linear = false
lcd_grid = 0
vsync = false

[audio]
volume = 100
driver = alsa
buffer_size = auto
mic = true

[emu]
jit = true
idle_skip = 1
limiter = 60
frameskip = 0
frameskip_mode = adaptive
ff_speed = 0
ff_skip = 3

[pad]
face_fix = off
a = a
b = b
x = x
y = y
l = leftshoulder
r = rightshoulder
start = start
select = back
stick_dpad = left
stylus_axis = right
stylus_button = rightstick

[hotkeys]
pause = none
pause.alt = none
fast_forward = none
fast_forward_toggle = Tab
save_state = F5
load_state = F7
volume_up = none
volume_down = none
mute = none

[padhotkeys]
# RGDS handles pause, checkpoints and physical volume without duplicate chords.
modifier = none
pause = none
quit = none
fast_forward = none
fast_forward_toggle = none
save_state = none
load_state = none
volume_up = none
volume_down = none
