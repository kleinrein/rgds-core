<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RG DS Flasher</title>
<link rel="icon" href="brand/mark.svg">
<style>
@font-face { font-family: Nunito; src: url(fonts/Nunito.ttf) format("truetype"); font-weight: 200 1000; }
/* themes/default/light.ini and dark.ini */
:root {
  --bg: #f2f5f7; --panel: #ffffff; --ink: #2d3944; --muted: #5e6c78; --accent: #236eae; --line: #bfccd7;
  --slot: #dde6ed; --on-accent: #ffffff; --focus: #e0f0fc; --grid: rgba(35, 110, 174, .07);
  --tile-a: #4fa6ef; --tile-b: #2580d2; --danger: #c93c3c; --ok: #2e9b5a; --warn: #9a6200; --warn-bg: #fff4dc;
  --shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 2px 6px rgba(30, 60, 90, .10);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c111a; --panel: #17202e; --ink: #e9f4ff; --muted: #91a7be; --accent: #4ebbff; --line: #2d435a;
    --slot: #111a27; --on-accent: #071524; --focus: #1a3d59; --grid: rgba(78, 187, 255, .06);
    --danger: #ff6b6b; --ok: #4fd08a; --warn: #ffc65c; --warn-bg: #2e2413;
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 2px 8px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 600 15px/1.35 Nunito, system-ui, sans-serif; color: var(--ink); background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; display: flex; flex-direction: column; -webkit-user-select: none; user-select: none;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
.bar { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
.bar img { height: 24px; display: block; }
.bar .lockup-dark { display: none; }
@media (prefers-color-scheme: dark) { .bar .lockup-light { display: none; } .bar .lockup-dark { display: block; } }
.bar .tag { margin-left: auto; color: var(--muted); font-size: 13px; }
.wrap { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 560px; margin: 0 auto; padding: 18px 18px 0; min-height: 0; }

.steps { display: flex; list-style: none; margin: 0 0 16px; padding: 0; gap: 4px; }
.steps li { flex: 1; text-align: center; font-size: 12px; color: var(--muted); position: relative; }
.steps li::before { content: ""; position: absolute; top: 14px; left: -50%; width: 100%; height: 3px; background: var(--slot); z-index: 0; }
.steps li:first-child::before { display: none; }
.steps li.past::before, .steps li.now::before { background: var(--accent); }
.steps .dot {
  position: relative; z-index: 1; width: 30px; height: 30px; margin: 0 auto 5px; border-radius: 50%; display: grid; place-items: center;
  background: var(--panel); border: 2px solid var(--line); color: var(--muted); font-weight: 800; font-size: 13px; transition: .25s;
}
.steps li.past .dot { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.steps li.now .dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--focus); }
.steps li.now { color: var(--ink); }

.panel {
  flex: 1; min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: var(--shadow); padding: 22px 20px; display: flex; flex-direction: column; animation: rise .25s ease;
}
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; letter-spacing: -.2px; }
.sub { color: var(--muted); margin: 0 0 18px; }
.grow { flex: 1; }
.center { text-align: center; align-items: center; justify-content: center; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile, .row {
  border: 2px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); font: inherit; text-align: left;
  cursor: pointer; transition: border-color .15s, background .15s, transform .1s; box-shadow: var(--shadow);
}
.tile { padding: 14px 12px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
.tile:hover, .row:hover { border-color: var(--accent); }
.tile:active, .row:active { transform: scale(.985); }
.tile.on, .row.on { border-color: var(--accent); background: var(--focus); }
.tile b { font-size: 17px; font-weight: 800; }
.tile small, .row small { color: var(--muted); font-size: 12.5px; }
.tile svg { width: 74px; height: 74px; margin-bottom: 4px; }
.pill { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 99px; background: var(--slot); color: var(--muted); vertical-align: 2px; }
.pill.blue { background: var(--accent); color: var(--on-accent); }

.facts { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
.fact { background: var(--slot); border-radius: 99px; padding: 5px 12px; font-size: 13px; color: var(--muted); }
.fact.good { color: var(--ok); }

.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; width: 100%; }
.row svg { width: 34px; height: 34px; flex: none; color: var(--accent); }
.row .txt { flex: 1; min-width: 0; }
.row .name { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .size { font-weight: 800; color: var(--muted); }
.row[disabled] { opacity: .55; cursor: not-allowed; border-color: var(--line); background: var(--panel); }
.row .why { color: var(--danger); }
.rowwarn { color: var(--warn); font-size: 12.5px; margin-top: 3px; white-space: normal; }
.warn { margin-top: 12px; background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.note { margin-top: 14px; color: var(--muted); font-size: 13.5px; display: flex; gap: 8px; align-items: flex-start; }
.note svg { flex: none; width: 18px; height: 18px; margin-top: 1px; }

.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); text-align: center; }
.empty svg { width: 96px; height: 96px; color: var(--accent); animation: bob 1.8s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(8px); } }

.progress { margin: 8px 0 10px; }
.big { font-size: 46px; font-weight: 900; letter-spacing: -1px; color: var(--accent); line-height: 1; margin-bottom: 14px; }
.track { height: 18px; border-radius: 99px; background: var(--slot); overflow: hidden; position: relative; box-shadow: inset 0 1px 3px rgba(0,0,0,.16); }
/* The width is set every frame from script (smoothed), so there is no CSS transition to fight. */
.fill {
  height: 100%; width: 0; min-width: 18px; border-radius: 99px; position: relative; overflow: hidden;
  background:
    linear-gradient(rgba(255,255,255,.30), rgba(255,255,255,.06) 50%, transparent 50%),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.13) 0 8px, transparent 8px 16px),
    linear-gradient(var(--tile-a), var(--tile-b));
  animation: stripes .9s linear infinite;
  box-shadow: 0 0 12px rgba(79, 166, 239, .45);
}
.fill[data-empty] { opacity: 0; }
/* A sheen that always crosses the whole filled part, whatever its width. */
.fill::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 45%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55) 50%, transparent);
  transform: translateX(-100%); animation: sheen 2.2s cubic-bezier(.45,.05,.35,1) infinite;
}
/* A soft light on the leading edge. */
.fill::before { content: ""; position: absolute; top: 2px; bottom: 2px; right: 2px; width: 10px; border-radius: 99px; background: rgba(255,255,255,.55); filter: blur(3px); }
@keyframes stripes { to { background-position: 0 0, 22.63px 0, 0 0; } }
@keyframes sheen { 60%, 100% { transform: translateX(225%); } }
@media (prefers-reduced-motion: reduce) { .fill, .fill::after { animation: none; } }
.stats { display: flex; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 13.5px; }

.check { width: 96px; height: 96px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; margin: 0 auto 18px; animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
.check svg { width: 52px; height: 52px; color: #fff; }
.check.bad { background: var(--danger); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.spin { width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--slot); border-top-color: var(--accent); animation: turn .8s linear infinite; margin: 0 auto 14px; }
@keyframes turn { to { transform: rotate(1turn); } }

.hints { display: flex; gap: 10px; padding: 14px 0 16px; }
.btn {
  font: inherit; font-weight: 800; font-size: 15px; border-radius: 12px; padding: 10px 16px 10px 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: var(--shadow);
  transition: transform .1s, filter .15s;
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary {
  margin-left: auto; color: #fff; border: 1px solid #1f6fb8; position: relative; overflow: hidden;
  background: linear-gradient(var(--tile-a), var(--tile-b)); text-shadow: 0 1px 0 rgba(0,0,0,.18);
}
.btn.primary::before { content: ""; position: absolute; inset: 0 0 52% 0; background: linear-gradient(rgba(255,255,255,.35), rgba(255,255,255,.08)); pointer-events: none; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn.danger { background: linear-gradient(#e46262, #c63b3b); border-color: #ab3030; color: #fff; }
.key {
  width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 900;
  background: var(--slot); color: var(--muted); border: 1px solid var(--line);
}
.primary .key, .danger .key { background: rgba(255,255,255,.95); color: var(--tile-b); border-color: transparent; }
.danger .key { color: #c63b3b; }

.modal { position: fixed; inset: 0; background: rgba(8, 16, 28, .45); display: grid; place-items: center; padding: 18px; animation: fade .15s; z-index: 5; }
@keyframes fade { from { opacity: 0; } }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px 16px; max-width: 440px; width: 100%; box-shadow: 0 18px 50px rgba(0,0,0,.3); animation: rise .2s; }
.dialog .hints { padding: 18px 0 0; }
.dialog h1 { display: flex; align-items: center; gap: 10px; }
.dialog h1 svg { width: 28px; height: 28px; color: var(--danger); }
.err { color: var(--danger); }
.muted { color: var(--muted); }
a { color: var(--accent); }
</style>
</head>
<body>
<header class="bar">
  <img class="lockup-light" src="brand/lockup-light.svg" alt="RG DS">
  <img class="lockup-dark" src="brand/lockup-dark.svg" alt="RG DS">
  <span class="tag" id="tag">Card flasher</span>
</header>
<div class="wrap">
  <ol class="steps" id="steps"></ol>
  <main class="panel" id="view"></main>
  <footer class="hints" id="hints"></footer>
</div>
<div id="modal"></div>
<script>
"use strict";
const STEPS = ["Download", "Pick card", "Flash", "Verify", "Done"];
const ICON = {
  ds: `<svg viewBox="0 0 80 80"><rect x="14" y="6" width="52" height="34" rx="7" fill="var(--slot)" stroke="var(--line)" stroke-width="2"/><rect x="21" y="11" width="38" height="24" rx="3" fill="url(#scr)"/><rect x="14" y="42" width="52" height="34" rx="7" fill="var(--slot)" stroke="var(--line)" stroke-width="2"/><rect x="27" y="47" width="26" height="20" rx="3" fill="url(#scr)"/><circle cx="20" cy="55" r="3" fill="var(--muted)"/><circle cx="61" cy="52" r="2.2" fill="var(--muted)"/><circle cx="57" cy="57" r="2.2" fill="var(--muted)"/><defs><linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FA6EF"/><stop offset="1" stop-color="#2580D2"/></linearGradient></defs></svg>`,
  plus: `<svg viewBox="0 0 80 80"><rect x="10" y="4" width="60" height="36" rx="7" fill="var(--slot)" stroke="var(--line)" stroke-width="2"/><rect x="16" y="9" width="48" height="26" rx="3" fill="url(#scr2)"/><rect x="10" y="42" width="60" height="36" rx="7" fill="var(--slot)" stroke="var(--line)" stroke-width="2"/><rect x="24" y="47" width="32" height="22" rx="3" fill="url(#scr2)"/><circle cx="17" cy="56" r="3" fill="var(--muted)"/><circle cx="63" cy="53" r="2.2" fill="var(--muted)"/><circle cx="59" cy="58" r="2.2" fill="var(--muted)"/><defs><linearGradient id="scr2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FA6EF"/><stop offset="1" stop-color="#2580D2"/></linearGradient></defs></svg>`,
  file: `<svg viewBox="0 0 80 80"><path d="M22 8h26l14 14v48a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4z" fill="var(--slot)" stroke="var(--line)" stroke-width="2"/><path d="M48 8v14h14" fill="none" stroke="var(--line)" stroke-width="2"/><rect x="28" y="40" width="24" height="18" rx="3" fill="#2580D2"/></svg>`,
  sd: `<svg viewBox="0 0 40 40"><path d="M12 4h17l5 5v25a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="currentColor" opacity=".18"/><path d="M12 4h17l5 5v25a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16 8v6M20 8v6M24 8v6M28 9v5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`,
  insert: `<svg viewBox="0 0 96 96"><path d="M30 8h30l10 10v46a4 4 0 0 1-4 4H30a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4z" fill="currentColor" opacity=".15"/><path d="M30 8h30l10 10v46a4 4 0 0 1-4 4H30a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4z" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M36 15v10M43 15v10M50 15v10M57 17v8" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M48 76v12M40 82l8 8 8-8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  tick: `<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  cross: `<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>`,
  alert: `<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z" fill="currentColor" opacity=".18"/><path d="M12 3l10 18H2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v5M12 18v.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`,
  info: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`,
};

const base = location.pathname.replace(/[^/]*$/, "");
let st = null;            // server state
let step = 0;             // the step the user is on while nothing runs
let model = "rgds";
let lastPhase = "";
let disks = null, pick = null, diskTimer = null, confirming = false;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const gb = n => n >= 1e9 ? (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + " GB" : Math.round(n / 1e6) + " MB";
const mb = n => Math.round(n / 1e6);
const left = (done, total, rate) => {
  if (!rate || done >= total) return "";
  const s = Math.max(1, Math.round((total - done) / rate));
  return s < 60 ? `${s} s left` : `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")} s left`;
};
const mac = () => st && st.os === "darwin", win = () => st && st.os === "windows";

async function post(name, body = {}) {
  const r = await fetch(base + "api/" + name, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
}

// The window outlives the program only by mistake (the program was ended, or this is an old window the browser
// kept). Once the flasher stops answering, the page says so and closes, so an old screen never sits behind a new one.
let es = null, lost = 0, closing = false;
function connect() {
  if (closing) return;
  es = new EventSource(base + "api/events");
  es.onmessage = e => { lost = 0; st = JSON.parse(e.data); render(); };
  es.onerror = () => { es.close(); if (++lost >= 4) gone(); else setTimeout(connect, 1000); };
}
function gone() {
  closing = true;
  if (es) es.close();
  document.body.innerHTML = `<div class="empty" style="height:100%"><p>RG DS Flasher has closed. You can close this window.</p></div>`;
  window.close();
}

// Which step the server's work puts us on; otherwise the user's own step.
function current() {
  switch (st.phase) {
    case "download": case "check": return 0;
    case "prepare": case "write": return 2;
    case "verify": case "reopen": case "eject": return 3;
    case "done": return 4;
    case "error": return st.errorStep === "download" ? 0 : 2;
    case "ready": return step === 0 ? 0 : 1;
  }
  return 0;
}

function render() {
  if (!st) return;
  if (st.phase === "ready" && (lastPhase === "download" || lastPhase === "check")) step = 1; // downloaded: on to the card
  lastPhase = st.phase;
  const now = current();
  $("tag").textContent = st.image && st.image.version ? `RG DS OS ${st.image.version}` : st.release && st.release.version ? `RG DS OS ${st.release.version}` : "Card flasher";
  const steps = STEPS.map((name, i) =>
    `<li class="${i < now || (i === 4 && now === 4) ? "past" : i === now ? "now" : ""}"><div class="dot">${i < now || (i === 4 && now === 4) ? ICON.tick.replace("<svg", '<svg width="16" height="16"') : i + 1}</div>${name}</li>`).join("");
  if ($("steps").dataset.html !== steps) { $("steps").dataset.html = steps; $("steps").innerHTML = steps; }
  const views = [viewDownload, viewCard, viewFlash, viewFlash, viewDone];
  const [html, hints, live] = st.phase === "error" && st.errorStep === "flash" ? viewError() : views[now]();
  const view = $("view");
  if (view.dataset.html !== html) {
    const fresh = view.dataset.step !== String(now) + st.phase.slice(0, 3);
    view.dataset.html = html;
    view.dataset.step = String(now) + st.phase.slice(0, 3);
    if (fresh) { view.style.animation = "none"; view.offsetHeight; view.style.animation = ""; }
    view.innerHTML = html;
  }
  if (live) {
    setGoal(live.pct);
    for (const k of ["amount", "left"]) { const el = view.querySelector(`[data-k="${k}"]`); if (el) el.textContent = live[k]; }
  }
  if ($("hints").dataset.html !== hints) { $("hints").dataset.html = hints; $("hints").innerHTML = hints; }
  diskPolling(now === 1 && st.phase === "ready");
}

const btn = (key, label, act, cls = "", disabled = false) =>
  `<button class="btn ${cls}" data-act="${act}" ${disabled ? "disabled" : ""}><span class="key">${key}</span>${label}</button>`;

// Progress markup stays the same while numbers change; render() fills the data-k parts in place and the bar
// glides toward the latest value, so updates every few hundred milliseconds still look continuous.
const bar = () => `<div class="track"><div class="fill" data-k="fill" data-empty></div></div>`;
const stats = () => `<div class="stats"><span data-k="amount"></span><span data-k="left"></span></div>`;
function progress() {
  const pct = st.total ? Math.min(100, st.done / st.total * 100) : 0;
  return { pct, amount: `${mb(st.done)} / ${mb(st.total)} MB${st.rate ? ` · ${(st.rate / 1e6).toFixed(1)} MB/s` : ""}`, left: left(st.done, st.total, st.rate) };
}

let goal = 0, shown = 0, goalPhase = "", lastFrame = 0;
function setGoal(pct) {
  if (st.phase !== goalPhase || pct < goal - 1) shown = pct; // a new phase starts where it starts, no sliding back
  goalPhase = st.phase;
  goal = pct;
}
function frame(t) {
  const dt = Math.min(0.1, (t - lastFrame) / 1000 || 0);
  lastFrame = t;
  shown += (goal - shown) * Math.min(1, dt * 5);
  if (Math.abs(goal - shown) < 0.02) shown = goal;
  const fill = document.querySelector('[data-k="fill"]');
  if (fill) {
    fill.style.width = shown.toFixed(2) + "%";
    if (shown > 0.3) fill.removeAttribute("data-empty");
  }
  const big = document.querySelector('[data-k="pct"]');
  if (big) big.textContent = Math.floor(shown) + "%";
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function viewDownload() {
  const rel = st.release;
  if (!rel) {
    if (st.releaseError && !st.loading) return [`<div class="empty"><div class="check bad">${ICON.cross}</div><h1>Can't find RG DS OS</h1><p class="sub">${esc(st.releaseError)}.<br>Check your internet connection.</p></div>`, btn("A", "Try again", "release", "primary")];
    return [`<div class="empty"><div class="spin"></div><p>Looking for the latest RG DS OS…</p></div>`, ""];
  }
  const images = rel.images;
  if (!images.some(i => i.model === model)) model = images[0].model;
  const img = images.find(i => i.model === model);
  const working = st.phase === "download" || st.phase === "check";
  const tiles = images.map(i => {
    const [title, note] = i.model === "plus" ? ["RG DS Plus", 'Fixed to the Plus <span class="pill">experimental</span>']
      : i.model === "rgds" ? ["RG DS", 'Recommended · also starts on the Plus'] : [esc(i.name), "This image file"];
    return `<button class="tile ${i.model === model ? "on" : ""}" data-act="model" data-model="${i.model}" ${working ? "disabled" : ""}>${ICON[i.model === "plus" ? "plus" : i.model === "rgds" ? "ds" : "file"]}<b>${title}</b><small>${note}</small></button>`;
  }).join("");
  let body = `<h1>Which handheld is it for?</h1><p class="sub">${rel.version ? `RG DS OS ${esc(rel.version)}, the latest release.` : "The image you gave the flasher."}${rel.offline ? " Offline: using the saved copy." : ""}</p><div class="tiles" style="${images.length === 1 ? "grid-template-columns:1fr" : ""}">${tiles}</div>`;
  if (working) {
    const checking = st.phase === "check";
    body += `<div class="grow"></div><div class="progress"><p><b>${checking ? "Checking the image" : "Downloading"}</b> <span class="muted">${checking ? "against its checksum" : esc(img.name)}</span></p>${bar()}${stats()}</div>`;
    return [body, btn("B", "Stop", "cancel"), progress()];
  }
  body += `<div class="facts">${img.cached ? `<span class="fact good">✓ Already downloaded</span>` : `<span class="fact">${img.size ? gb(img.size) + " download" : "Download"}</span>`}<span class="fact">Saved for the next card</span></div>`;
  if (st.phase === "error" && st.errorStep === "download") body += `<div class="warn">${esc(st.error)}</div>`;
  body += `<div class="grow"></div><div class="note">${ICON.info}<span>You need a microSD card of 8 GB or more. Your handheld's built-in storage is never touched; your old card brings stock back.</span></div>`;
  return [body, btn("A", img.cached ? "Next" : "Download", "prepare", "primary")];
}

function viewCard() {
  let body = `<h1>Pick your microSD card</h1><p class="sub">Only removable cards are shown. 8 GB or more is best.</p>`;
  if (disks && disks.length && !disks.some(d => d.id === pick && !d.problem)) pick = (disks.find(d => !d.problem) || {}).id || null;
  if (!disks) body += `<div class="empty"><div class="spin"></div></div>`;
  else if (!disks.length) body += `<div class="empty">${ICON.insert}<b style="color:var(--ink);font-size:17px">Put the microSD card in your computer</b><span>It shows up here by itself.</span></div>`;
  else {
    body += `<div class="list">` + disks.map(d => `<button class="row ${d.id === pick ? "on" : ""}" data-act="disk" data-id="${esc(d.id)}" ${d.problem ? "disabled" : ""}>${ICON.sd}<span class="txt"><div class="name">${esc(d.name)}</div><small>${d.problem ? `<span class="why">${esc(d.problem)}</span>` : esc([d.path, ...(d.volumes || [])].join(" · "))}</small>${d.id === pick && d.warnings ? d.warnings.map(w => `<div class="rowwarn">${esc(w)}</div>`).join("") : ""}</span><span class="size">${gb(d.size)}</span></button>`).join("") + `</div>`;
  }
  const ok = disks && disks.some(d => d.id === pick && !d.problem);
  return [body, btn("B", "Back", "back") + btn("A", "Flash", "confirm", "primary", !ok)];
}

function viewFlash() {
  const ph = st.phase, d = st.disk || {};
  const name = esc(d.name || "the card");
  if (ph === "prepare") {
    const ask = mac() ? "Enter your password when your Mac asks for it." : win() ? "Choose Yes when Windows asks for permission." : "Enter your password if asked.";
    return [`<div class="empty"><div class="spin"></div><h1 style="color:var(--ink)">Getting ${name} ready</h1><p>${ask}</p></div>`, ""];
  }
  if (ph === "reopen") {
    const ask = "";
    return [`<div class="empty"><div class="spin"></div><h1 style="color:var(--ink)">Finding the card again</h1><p>The card reader restarted. That's fine: the flasher carries on as soon as the card is back.${ask}</p></div>`, ""];
  }
  if (ph === "eject") return [`<div class="empty"><div class="spin"></div><h1 style="color:var(--ink)">Ejecting the card</h1></div>`, ""];
  const verify = ph === "verify";
  let body = `<h1>${verify ? "Final check" : "Writing the card"}</h1><p class="sub">${verify ? "Reading the whole card back once more and comparing it with the image." : `RG DS OS goes onto ${name} byte for byte, and each part is read back as it goes.`}</p>
    <div class="grow"></div><div class="big" data-k="pct">0%</div>${bar()}${stats()}<div class="grow"></div>
    <div class="note">${ICON.info}<span>Leave the card in until it's done.${win() ? " If Windows asks to <b>format</b> the disk, choose <b>Cancel</b>: never format it." : ""}</span></div>`;
  return [body, "", progress()];
}

function viewDone() {
  const winNote = win() ? `<div class="note" style="text-align:left">${ICON.info}<span>Windows may ask to <b>format</b> the card when you put it back in: always choose <b>Cancel</b>. It only shows the RGDS-BOOT part; that's normal.</span></div>` : "";
  return [`<div class="empty"><div class="check">${ICON.tick}</div><h1 style="color:var(--ink)">Your card is ready</h1><p>Written, checked and ejected. Take it out, put it in your RG DS<br>and power on. The first boot sets up the rest of the card.</p>${winNote}</div>`,
    btn("B", "Close", "quit") + btn("A", "Flash another card", "again", "primary")];
}

function viewError() {
  return [`<div class="empty"><div class="check bad">${ICON.cross}</div><h1 style="color:var(--ink)">That didn't work</h1><p class="err">${esc(st.error)}</p><p>Try again. If it keeps failing, try another card or card reader.</p><p class="muted" style="font-size:12.5px">What happened is written to <a href="#" data-act="log">${esc(st.log)}</a>. Send it along when you report a problem.</p></div>`,
    btn("B", "Close", "quit") + btn("X", "Show log", "log") + btn("A", "Try again", "again", "primary")];
}

function confirmDialog() {
  const d = disks.find(x => x.id === pick);
  if (!d) return;
  confirming = true;
  const ask = mac() ? "Your Mac will ask for your password next." : win() ? "Windows will ask for permission next." : "";
  $("modal").innerHTML = `<div class="modal"><div class="dialog"><h1>${ICON.alert}Erase this card?</h1>
    <p>Everything on <b>${esc(d.name)}</b> (${gb(d.size)}${d.volumes && d.volumes.length ? ", " + esc(d.volumes.join(", ")) : ""}) will be erased.</p>
    ${(d.warnings || []).map(w => `<div class="warn">${esc(w)}</div>`).join("")}
    ${ask ? `<p class="muted">${ask}</p>` : ""}
    <div class="hints">${btn("B", "Cancel", "close")}${btn("A", "Erase and flash", "flash", "primary danger")}</div></div></div>`;
}
function closeDialog() { confirming = false; $("modal").innerHTML = ""; }

async function act(name, el) {
  try {
    switch (name) {
      case "model": model = el.dataset.model; render(); break;
      case "release": await post("release"); break;
      case "prepare": await post("prepare", { model }); break;
      case "cancel": await post("cancel"); break;
      case "disk": pick = el.dataset.id; render(); break;
      case "back": step = 0; render(); break;
      case "confirm": confirmDialog(); break;
      case "close": closeDialog(); break;
      case "flash": { const id = pick; closeDialog(); step = 2; await post("flash", { disk: id, confirm: id }); break; }
      case "again": step = 1; disks = null; await post("again"); break;
      case "log": await post("log"); break;
      case "quit": await post("quit"); gone(); break;
    }
  } catch (e) {
    alert(e.message);
    step = st && st.image ? 1 : 0;
    render();
  }
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled) act(el.dataset.act, el);
});
document.addEventListener("keydown", e => {
  const scope = confirming ? $("modal") : document;
  if (e.key === "Enter" || e.key === "a") { const b = scope.querySelector(".btn.primary:not(:disabled)"); if (b) { e.preventDefault(); b.click(); } }
  if (e.key === "x") { const b = scope.querySelector('[data-act="log"].btn'); if (b) b.click(); }
  if (e.key === "Escape" || e.key === "Backspace" || e.key === "b") { const b = scope.querySelector(".hints .btn:not(.primary)"); if (b) { e.preventDefault(); b.click(); } }
  if (!confirming && ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
    const items = [...document.querySelectorAll(".tile:not(:disabled), .row:not(:disabled)")];
    const i = items.findIndex(x => x.classList.contains("on"));
    const next = items[(i + (e.key === "ArrowUp" || e.key === "ArrowLeft" ? -1 : 1) + items.length) % items.length];
    if (next) { e.preventDefault(); next.click(); }
  }
});

function diskPolling(on) {
  if (on && !diskTimer) {
    const load = async () => {
      try { const r = await fetch(base + "api/disks"); if (r.ok) { disks = await r.json(); render(); } } catch {}
    };
    load();
    diskTimer = setInterval(load, 1500);
  } else if (!on && diskTimer) { clearInterval(diskTimer); diskTimer = null; }
}

connect();
</script>
</body>
</html>
