# The RK817 (speakers or the headphone jack) through dmix; /etc/asound.conf refers to it via /run/rgds/audio-out.conf.
pcm.rgds_out {
    type plug
    slave.pcm {
        type dmix
        ipc_key 1380402259
        ipc_perm 0666
        slave {
            pcm "hw:0,0"
            format S16_LE
            rate 48000
            channels 2
            period_size 512
            buffer_size 2048
        }
    }
}
