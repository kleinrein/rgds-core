# RG DS OS: one shared playback stream on the RK817 (dmix, as RG DS Core uses on stock), so the menu, a game and a
# cue can play at once and the codec stays at one rate and buffer size instead of being reopened per client.
# Where playback goes is read from /run/rgds/audio-out.conf at every open (a `refer` with a file is re-read each
# time, also inside a process that is already running): /usr/libexec/rgds/audio puts this handheld's own output there
# (the speaker; the RG DS Plus's jack while headphones are in) and /usr/libexec/rgds/bt-audio swaps in a Bluetooth
# headset while one is connected and back when it goes. The microphone is pcm.rgds_in in /run/rgds/audio-capture.conf
# (the RK817, whichever card number it got).
pcm.!default {
    type asym
    playback.pcm {
        @func refer
        file "/run/rgds/audio-out.conf"
        name "pcm.rgds_out"
    }
    capture.pcm {
        @func refer
        file "/run/rgds/audio-capture.conf"
        name "pcm.rgds_in"
    }
}
# this handheld's own output by name, whatever playback follows
pcm.rgds_speaker {
    @func refer
    file "/run/rgds/audio-local.conf"
    name "pcm.rgds_out"
}
# the microphone by name (DSCore's mic_dev and the Microphone page on RG DS OS, runtime/audio.py capture_device)
pcm.rgds_mic {
    @func refer
    file "/run/rgds/audio-capture.conf"
    name "pcm.rgds_in"
}
ctl.!default { type hw card 0 }
