# RG DS OS: one shared playback stream on the RK817 (dmix, as RG DS Core uses on stock), so the menu, a game and a
# cue can play at once and the codec stays at one rate and buffer size instead of being reopened per client.
# Where playback goes is read from /run/rgds/audio-out.conf at every open (a `refer` with a file is re-read each
# time, also inside a process that is already running): rcS puts the speaker there (/etc/asound-speaker.conf), and
# /usr/libexec/rgds/bt-audio swaps in a Bluetooth headset while one is connected and back when it goes.
pcm.!default {
    type asym
    playback.pcm {
        @func refer
        file "/run/rgds/audio-out.conf"
        name "pcm.rgds_out"
    }
    capture.pcm "plughw:0,0"
}
# the speaker by name, whatever playback follows (the headphone jack is the same codec)
pcm.rgds_speaker {
    @func refer
    file "/etc/asound-speaker.conf"
    name "pcm.rgds_out"
}
ctl.!default { type hw card 0 }
