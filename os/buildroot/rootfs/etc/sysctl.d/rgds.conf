# quiet console
kernel.printk = 3 3 3 3
# a panic restarts instead of hanging: a power-off would wipe the RAM that holds its record (rcS, ramoops)
kernel.panic = 5
# saves reach the card within 2 s
vm.dirty_writeback_centisecs = 200
vm.dirty_expire_centisecs = 200
# with zram swap (usr/libexec/rgds/zram) 0 still swaps, but only once the page cache is nearly gone: insurance
# against the OOM killer, never a cost to a running game
vm.swappiness = 0
# zram is RAM: reading neighbouring swap pages ahead gains nothing
vm.page-cluster = 0
