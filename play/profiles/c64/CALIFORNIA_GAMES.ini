# California Games (Commodore 64, Epyx 1987). Six events on two disk sides, and
# the game prints each event's scores once before forgetting them: the second
# screen keeps what won each event beside the record to beat, and the players'
# medals, which the game only shows between events.
# Found on the 3-disk copy through VICE (1 November 2026; no RAM map is
# published) by reading its code: the players' table at 0800, 32 bytes each and
# re-sorted between events (name +0, team +F, last score as text +10, gold,
# silver and bronze counts +19..1B, the code at 2224 counts them 5, 3 and 1), the
# number of players at 081D, the event at 081E (7: the final standings, 1B4B
# gives each event's place in the records), the records at 0900, 21 bytes each.
[game]
system = c64
title = California Games
codes = CALIFORNIA_GAMES

[companion]
note = What won each event, the records to beat and everyone's medals

[view]
format = events
on = mem8[081D] in 1..8 and mem8[081E] in 1..7
players = mem8[081D]
event = mem8[081E]
names = Half Pipe; Foot Bag; Surfing; Skating; BMX; Flying Disk
records = 0800 20
record_name = 0 F
record_score = 10 6
record_medals = 19
best = 0900 15
best_name = 0 C
best_score = C 6
