# Wario Land 3 (World). The level's progress on the second screen, as the
# pause screen shows it: the four keys and treasure chests (grey, red, green,
# blue), the musical coins found and the coins carried, kept up to date while
# Wario plays. RAM facts from the warioland3 disassembly (ElectroDeoxys).
# The status board ([view.status]) reads Data Crystal's RAM map
# (datacrystal.tcrf.net, Wario Land 3/RAM map): scene C09B, coins CA04-CA05
# and treasures CA39-CA3A (decimal digits), keys CA5B (a bit each), musical
# coins CA5C, day or night bit 0 of CA3B.
[game]
system = gb
title = Wario Land 3
codes = AW8A AW8E AW8P AW8J

[companion]
note = Keys, treasures and coins appear in a level
# in a level (game state 02 at C09B)
live = mem8[C09B] == 02
# the title, the world map, a cleared level: the last level's picture goes
menu = mem8[C09B] == 00 | 01 | 03
# recaptured when the coins (wNumCoins, BCD), the keys and treasures
# (wKeyAndTreasureFlags) or the musical coins change: Progress WRAM starts at
# CA00 (after wROMBank C5FF and the room block tiles), Level WRAM at CA5B; the
# language byte CA46 (1, English) checks the sum
room = mem8[CA04] mem8[CA05] mem8[CA5B] mem8[CA5C]
interval = 1800
dim_when_unavailable = yes

[map]
open = START:4
timeout = 90
# the pause screen (game state 04) once it has slid in (step 03)
ready = mem8[C09B] == 04 and mem8[C09C] == 03
crop = 0 64 160 80
max_diff = 200

[view.status]
# the game's own names, as the top screen writes them
proper = Wario Land 3
# The journey, a tap away from the pause screen's picture: this level's
# coins, the keys and musical coins found, all the treasures, day or night.
format = board
alternative = yes
on = mem8[C09B] == 01 | 02 | 04
heading = Wario Land 3
heading_icon = treasure
tile1 = Coins | bcd CA04 2 icon coin
tile2 = Musical coins | num CA5C 1 of 8 icon star
tile3 = Keys | bits CA5B 1 wide of 4 icon key
tile4 = Treasures | bcd CA39 2 wide of 100 icon treasure
tile5 = Time of day | num CA3B 1 mask 01 wide names icon sun
tiers5 = 0 Day; 1 Night
