# Dragon Warrior Monsters (USA, Europe). The party of three on the second
# screen, live: each monster's name, species, level, HP and MP. The record
# layout is the dwm1 disassembly's (structures/monster.asm, names from
# data/monster_name_table.asm); where the party sits was found in the ROM:
# the monster storage starts at CAC1 (indexed by slot times 0x95), and the
# game puts the party at its front (551D0: the members copied to C300, then
# to CAC1), with a byte per place at C8C4, FF where the party has nobody.
[game]
system = gb
title = Dragon Warrior Monsters
codes = AWQE

[companion]
note = Your monsters appear once you have one

[party]
format = dwm1
# the three party records, 0x95 bytes each, and which places are filled
slots = CAC1
count = C8C4
# the ROM's list of species names, in species order
names = 41:5B1F
