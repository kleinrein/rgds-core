# The Legend of Zelda: Oracle of Ages (USA; Europe, in five languages).
# The status bar (the B and A items, rupees and hearts) moves from the top of
# the game screen to the second screen, under the map SELECT opens. RAM facts from the oracles-disasm
# project (USA addresses, which the European release shares: checked on its
# hearts, game state and menus).
# The status board ([view.status], behind the switch at the top right) reads
# oracles-disasm's WRAM (include/wram.s): health C6AA (quarters) and the
# heart pieces C6AC, rupees C6AD (BCD), the essences C6BF (a bit
# each), sword C6B2 and shield C6AF levels and the seed counts.
# Checked against a save with three hearts and the level-1 shield.
[game]
system = gb
title = The Legend of Zelda: Oracle of Ages
codes = AZ8E AZ8P

[hud]
# Playing (game state 2 at C2EE), the screen scrolling as it does in play
# (CD00 is 0 in the opening scenes, which have no status bar) and no menu open
# (CBCB: the inventory, map and save screens fill the whole screen).
on = mem8[C2EE] == 02 and mem8[CD00] != 00 and mem8[CBCB] == 00
strip = 0 0 160 16

[companion]
note = The map appears once the story lets you open it
# Playing (game state 2), the screen not scrolling (wScrollMode CD00), no
# menu or text up, menus allowed (CC02), and the
# opening done: SELECT and START do nothing but buzz until the game sets
# GLOBALFLAG_INTRO_DONE (bit 2 of C6D1, in wGlobalFlags).
live = mem8[C2EE] == 02 and mem8[CD00] != 00 and mem8[CD00] & 0E == 00 and mem8[CBCB] == 00 and mem8[CBA0] == 00 and mem8[CC02] == 00 and mem8[C6D1] & 04 == 04
# the room Link is in (wActiveRoom)
room = mem8[CC30]
interval = 120
dim_when_unavailable = yes

[map]
open = SELECT:4
timeout = 150
# the map menu (menu type 2 at CBCB) running (load state 1 at CBCC), and
# unchanged for long enough to outlast the white screen before it fades in
# (the palette thread rests for about 12 frames between fading out and in)
ready = mem8[CBCB] == 02 and mem8[CBCC] == 01
stable = 24
# the blinking cursor on Link's square
anim_frames = 8
anim_step = 4
max_diff = 400

[view.status]
# the game's own names, as the top screen writes them
proper = Labrynna; Link; Wooden sword; Noble sword; Master sword; Wooden shield; Iron shield; Mirror shield; Ember seeds; Scent seeds; Pegasus seeds; Gale seeds; Mystery seeds; Ore chunks
# Link at a glance, a tap away from the map: hearts, heart pieces, rupees,
# the essences, the sword and shield, and the seeds in the satchel.
format = board
alternative = yes
on = mem8[C2EE] == 02
heading = Labrynna
heading_icon = heart
tile1 = Hearts | num C6AA 1 div 4 icon heart page Link
tile2 = Heart pieces | num C6AC 1 of 4 icon heart
tile3 = Rupees | bcd C6AD 2 low wide icon gem
tile4 = Essences | bits C6BF 1 wide of 8 icon star
tile6 = Sword | num C6B2 1 wide names icon sword page Gear
tiers6 = 1 Wooden sword; 2 Noble sword; 3 Master sword
tile7 = Shield | num C6AF 1 wide names icon shield
tiers7 = 1 Wooden shield; 2 Iron shield; 3 Mirror shield
tile8 = Ember seeds | bcd C6B9 1 icon spark page Seeds
tile9 = Scent seeds | bcd C6BA 1 icon spark
tile10 = Pegasus seeds | bcd C6BB 1 icon spark
tile11 = Gale seeds | bcd C6BC 1 icon spark
tile12 = Mystery seeds | bcd C6BD 1 icon spark
