# The Legend of Zelda: Link's Awakening DX (USA, Europe; Japan uses AZLJ).
# The status bar (the B and A items, rupees and hearts) moves to the second
# screen, under the map of Koholint Island, which SELECT opens; inside a
# dungeon, under the dungeon's floor map from the inventory (START): the rooms
# seen, the chests and the boss once you have the map and compass, the keys.
# RAM facts from the zladx disassembly (LADX-Disassembly); checked on the
# USA/Europe Rev 2 cartridge.
# The status board ([view.status], behind the switch at the top right) reads
# the zladx disassembly's WRAM: health DB5A (eighths of a heart) and the
# containers DB5B, rupees DB5D-DB5E (BCD), small keys DBD0, the instruments
# DB65-DB6C, seashells DB0F and golden leaves DB15. Checked against a save
# with three hearts and two keys.
[game]
system = gb
title = The Legend of Zelda: Link's Awakening DX
codes = AZLE AZLP AZLJ

[hud]
# In the world (gameplay type 0B) with the status bar where the game keeps it:
# the window layer at line 128.
on = mem8[DB95] == 0B and mem8[FF4A] == 80
strip = 0 128 160 16

[companion]
# Walking about: no dialog box open
# (C19F), no room scrolling (C124)
live = mem8[DB95] == 0B and mem8[C19F] == 00 and mem8[C124] == 00
# the intro and the file screens
menu = mem8[DB95] in 00..06
# the room Link is in
room = mem8[FFF6]
interval = 120
dim_when_unavailable = yes

[map]
open = SELECT:4
timeout = 120
# the world map (gameplay type 07) once it has faded in (step 05)
ready = mem8[DB95] == 07 and mem8[DB96] == 05
# the blinking cursor on Link's square
anim_frames = 8
anim_step = 4
max_diff = 400

[map.dungeon]
# Inside one of the eight dungeons (indoors, map 00-08 at FFF7): the floor map
# the inventory shows, with the keys and the dungeon's items above it. The
# warp that brought a probe into Tail Cave to check it: the door warp
# wWarp0 (D401) set to category 1, map 00, room 17.
when = mem8[DBA5] == 01 and mem8[FFF7] in 00..08
open = START:4
timeout = 120
# the inventory (gameplay type 0C) once it has slid in (step 08)
ready = mem8[DB95] == 0C and mem8[DB96] == 08
# the right-hand panel: the level, keys and items, the map
crop = 72 36 88 108
max_diff = 400

[map.colour]
# The Color Dungeon (map FF) has a floor map of its own, in the same place.
when = mem8[DBA5] == 01 and mem8[FFF7] == FF
open = START:4
timeout = 120
ready = mem8[DB95] == 0C and mem8[DB96] == 08
crop = 72 36 88 108
max_diff = 400

[view.status]
# the game's own names, as the top screen writes them
proper = Koholint; Link
# Koholint at a glance, a tap away from the map: hearts and containers,
# rupees, the instruments found, the secret seashells and golden leaves, keys.
format = board
alternative = yes
on = mem8[DB95] == 0B
heading = Koholint
heading_icon = heart
tile1 = Hearts | num DB5A 1 div 8 icon heart page Link
tile2 = Heart containers | num DB5B 1 of 14 icon heart
tile3 = Rupees | bcd DB5D 2 icon gem
tile4 = Small keys | num DBD0 1 icon key
tile5 = Instruments | bits DB65 8 wide of 8 icon star
tile6 = Secret seashells | num DB0F 1 of 26 icon treasure page Collection
tile7 = Golden leaves | num DB15 1 of 5 icon spark
