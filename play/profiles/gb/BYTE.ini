# Pokémon Crystal (USA, Europe). The team on the second screen: each Pokémon's
# own party icon in its normal (or shiny) colours, name, level, HP and status,
# live. The party sits in work RAM bank 1, read whichever bank the game has
# mapped. Party layout and ROM tables from the pret disassembly (pokecrystal);
# checked on Crystal (USA, Europe) Rev 1. Rev 0 is not checked.
# The trainer card ([view.trainer], behind the switch at the top right) is
# from pret's pokecrystal (wMoney 1:D84E, three bytes, the first the highest;
# wJohtoBadges 1:D857, wKantoBadges 1:D858; wPokedexCaught 1:DE99 and
# wPokedexSeen 1:DEB9, a bit a species), checked on a save with the starting
# ₽3000 and Totodile caught.
[game]
system = gb
title = Pokémon Crystal
codes = BYTE

[party]
format = pokemon2
count = 1:DCD7
slots = 1:DCDF
names = 1:DE41
# a byte per species: its icon; then a pointer per icon (bank 23)
icon_kinds = 23:6AC4
icons = 23:6BBF
# each species' two middle colours, normal then shiny
icon_palettes = 02:68CE

[view]
# In a battle (1 wild, 2 a trainer, at wBattleMode): the opponent and your
# Pokémon with its moves, over the team, which comes back when it ends.
format = pokemon_battle
on = mem8[1:D22D] == 01 | 02
generation = 2
player = C62C
player_name = C621
enemy = 1:D206
enemy_name = C616
move_names = 72:5F29
moves = 10:5AFB
type_names = 14:497B
icon_kinds = 23:6AC4
icons = 23:6BBF
icon_palettes = 02:68CE

[view.trainer]
# The trainer card, a tap away from the team: money, both regions' badges and the Pokédex.
format = board
alternative = yes
on = mem8[1:DCD7] in 01..06
heading = Trainer
heading_icon = life
tile1 = Money | num 1:D84E 3 big wide icon coin
tile2 = Johto badges | bits 1:D857 1 of 8 icon star
tile3 = Kanto badges | bits 1:D858 1 of 8 icon star
tile4 = Pokédex caught | bits 1:DE99 32 of 251 icon check
tile5 = Pokédex seen | bits 1:DEB9 32 of 251 icon info
