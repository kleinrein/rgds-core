# Pokémon Crystal (USA, Europe). The team on the second screen: each Pokémon's
# own party icon in its normal (or shiny) colours, name, level, HP and status,
# live. The party sits in work RAM bank 1, read whichever bank the game has
# mapped. Party layout and ROM tables from the pret disassembly (pokecrystal);
# checked on Crystal (USA, Europe) Rev 1. Rev 0 is not checked.
[game]
system = gb
title = Pokémon Crystal
codes = BYTE

[party]
format = pokemon2
count = 1:DCD7
slots = 1:DCDF
names = 1:DE41
# a byte per species: its icon; then a pointer per icon (bank 23)
icon_kinds = 23:6AC4
icons = 23:6BBF
# each species' two middle colours, normal then shiny
icon_palettes = 02:68CE
