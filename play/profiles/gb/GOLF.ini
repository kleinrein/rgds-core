# Golf (World). The whole hole on the second screen, as B shows it: the
# fairway, hazards and green from tee to pin, the ball, the hole's number,
# length and par, the wind and the distance left. It is redrawn between
# shots. The cart has no game code, so the header title names it. RAM found
# by comparing the game's screens (no disassembly).
[game]
system = gb
title = Golf
codes = GOLF

[companion]
note = The hole appears when you're lining up a shot
# Looking over the course before a shot (screen 02 at FFB5): not aiming,
# swinging or watching the ball fly (06), not the scorecard (09)
live = mem8[FFB5] == 02
# recaptured after each shot (C487 counts the strokes), otherwise twice a minute
room = mem8[C487]
interval = 1800
dim_when_unavailable = yes

[map]
open = B:4
timeout = 120
# the hole's overview (screen 03) once it has been drawn
ready = mem8[FFB5] == 03
stable = 10
# the ball and the aim blink
max_diff = 200
