# Harvest Moon GB (USA; Europe). The status box SELECT shows (the date, the
# time and the gold) on the second screen all day long, kept up to date while
# you farm. The cartridge's header carries no game code, so its title names
# it. Checked on the European release.
[game]
system = gb
title = Harvest Moon GB
codes = HARVEST_MOON_GB

[companion]
note = The time and your gold appear once you're farming
# recaptured when the gold changes (CCCA, two bytes), and every ten seconds
# for the hour the box shows
room = mem8[CCCA] mem8[CCCB]
interval = 600
dim_when_unavailable = yes

[map]
open = SELECT:4
timeout = 90
# the text prints a letter at a time: wait until nothing has changed for a while
stable = 20
max_diff = 8
# the box's dark border on all four sides (it has no RAM flag we know of), and
# three pixels of the gold's G, which ends the second line at the same place
# every time: a dialog box has the same border, never ink there
pixels = 0,120=#211000 159,120=#211000 80,104=#211000 80,143=#211000 142,132=#211000 142,134=#211000 137,130=#211000
tolerance = 8
crop = 0 104 160 40
