# Metroid II: Return of Samus (World). The game has no map: the second screen
# draws one as Samus explores, every screen of SR388 the first time it comes
# into view, from the cartridge's own level data (solid and open tiles, the
# walls of each room), with Samus on it. It is kept beside the save. The
# status bar (energy, missiles, Metroids left) moves under it.
# RAM and level data facts from the M2RoS disassembly (metroidret/M2RoS).
[game]
system = gb
title = Metroid II: Return of Samus
codes = METROID2

[hud]
# In the game (game mode 4) with the status bar where the game keeps it: the
# window layer at line 136.
on = mem8[FF9B] == 04 and mem8[FF4A] == 88
strip = 0 136 160 8

[view]
format = metroid2
# in the game, or paused (8)
on = mem8[FF9B] == 04 | 08
# the level bank Samus is in (one of seven areas of 16x16 screens)
level_bank = D058
# the camera: Y pixel, Y screen, X pixel, X screen
camera = FFC8
# Samus on the screen: Y, X (sprite coordinates)
samus = D03B
# the room's tileset: four tiles per metatile; tiles below this are solid
metatiles = DA00
solid_below = D056
# in each level bank: a pointer per screen to its metatiles, a byte per screen of camera stops
screens = 4000
edges = 4200
