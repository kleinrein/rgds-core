# Pokémon Red and Blue (USA, Europe). The team on the second screen: each
# Pokémon's party icon in its Super Game Boy colours, name, level, HP and
# status, live. These carts have no game code, so the header title names them.
# Party layout and ROM tables from the pret disassembly (pokered); checked on
# Blue (USA, Europe). Red's tables sit at the same addresses.
# The trainer card ([view.trainer], behind the switch at the top right) is
# from pret's pokered (wPlayerMoney D347, BCD; wObtainedBadges D356;
# wPokedexOwned D2F7 and wPokedexSeen D30A, a bit a species), checked on a
# save with the starting ₽3000.
[game]
system = gb
title = Pokémon Red and Blue
codes = POKEMON_BLUE POKEMON_RED

[party]
format = pokemon1
count = D163
slots = D16B
names = D2B5
# internal species number -> Pokédex number
dex_order = 10:5024
# a nybble per Pokédex number: which of the ten icon shapes
icon_kinds = 1C:590D
# the game's own table of icon tile copies into sprite VRAM
icons = 1C:57C0
# each species' Super Game Boy palette, and the palettes
icon_palette_index = 1C:65C8
icon_palettes = 1C:6660

[view]
# In a battle (1 wild, 2 a trainer): the opponent and your Pokémon with its
# moves, over the team, which comes back when the battle ends.
format = pokemon_battle
on = mem8[D057] == 01 | 02
generation = 1
player = D014
player_name = D009
enemy = CFE5
enemy_name = CFDA
move_names = 2C:4000
moves = 0E:4000
type_names = 09:7DAE
dex_order = 10:5024
icon_kinds = 1C:590D
icons = 1C:57C0
icon_palette_index = 1C:65C8
icon_palettes = 1C:6660

[view.trainer]
# The trainer card, a tap away from the team: money, badges and the Pokédex.
format = board
alternative = yes
on = mem8[D163] in 01..06
heading = Trainer
heading_icon = life
tile1 = Money | bcd D347 3 wide icon coin
tile2 = Badges | bits D356 1 wide of 8 icon star
tile3 = Pokédex caught | bits D2F7 19 of 151 icon check
tile4 = Pokédex seen | bits D30A 19 of 151 icon info
