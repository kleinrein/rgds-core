# Pokémon Yellow (USA, Europe). The team on the second screen, as for Red and
# Blue: each Pokémon's party icon in its Super Game Boy colours, name, level,
# HP and status, live. The cart has no game code, so the header title names it.
# Party layout and ROM tables from the pret disassembly (pokeyellow); the
# party sits a byte lower than in Red and Blue.
# The trainer card ([view.trainer], behind the switch at the top right) is
# from pret's pokeyellow, a byte below Red and Blue (wPlayerMoney D346, BCD; wObtainedBadges D355;
# wPokedexOwned D2F6 and wPokedexSeen D309, a bit a species), checked on a
# save with the starting ₽3000.
[game]
system = gb
title = Pokémon Yellow
codes = POKEMON_YELLOW

[party]
format = pokemon1
count = D162
slots = D16A
names = D2B4
# internal species number -> Pokédex number
dex_order = 10:50B1
# a nybble per Pokédex number: which of the icon shapes
icon_kinds = 1C:59BA
# the game's own table of icon tile copies into sprite VRAM
icons = 1C:584D
# each species' Super Game Boy palette, and the palettes
icon_palette_index = 1C:6921
icon_palettes = 1C:69B9

[view]
# In a battle (1 wild, 2 a trainer): the opponent and your Pokémon with its
# moves, over the team, which comes back when the battle ends.
format = pokemon_battle
on = mem8[D056] == 01 | 02
generation = 1
player = D013
player_name = D008
enemy = CFE4
enemy_name = CFD9
move_names = 2F:4000
moves = 0E:4000
type_names = 09:7D63
dex_order = 10:50B1
icon_kinds = 1C:59BA
icons = 1C:584D
icon_palette_index = 1C:6921
icon_palettes = 1C:69B9

[view.trainer]
# The trainer card, a tap away from the team: money, badges and the Pokédex.
format = board
alternative = yes
on = mem8[D162] in 01..06
heading = Trainer
heading_icon = life
tile1 = Money | bcd D346 3 wide icon coin
tile2 = Badges | bits D355 1 wide of 8 icon star
tile3 = Pokédex caught | bits D2F6 19 of 151 icon check
tile4 = Pokédex seen | bits D309 19 of 151 icon info
