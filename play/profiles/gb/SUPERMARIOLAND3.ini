# Wario Land: Super Mario Land 3 (World). The second screen is a status board:
# in a course it takes the status bar's place (so a course keeps the whole top
# screen): the course's coins and the time left, lives and hearts, the coin
# bank and the treasures (the game shows neither in a course; together they
# decide the ending). On the world map it is the journey: courses cleared per
# world, the treasures, and the ending the coin bank reaches so far. Badges
# are the game's own status-bar tiles. The cart has no game code, so the
# header title names it.
# The game keeps its work RAM in the cartridge's (A000-BFFF). Found by
# comparing the title, the maps and the courses, and from the ROM: the status
# bar's routine (0CC5) reads the course coins A97A-A97B, hearts A808, lives
# A809 and the time A964-A965; the save block A804-A817 holds the bank at
# A805-A807 (all BCD) and the treasures as bits 1-7 of A80E and all of A80F
# (5510 checks FE and FF for all fifteen). Mode A8C3: 01 the world map, 03 a
# course. The status bar's tiles are plain 2bpp in bank 11 (the Wario head at
# 73E0, coin 73F0, heart 73A0, the T of the timer 7390), found by matching
# VRAM in a course against the ROM.
# Course completion (one bit a course: A80B Rice Beach, A80C Mt. Teapot,
# A810-A814 Stove Canyon, SS Tea Cup, Parsley Woods, Sherbet Land, Syrup
# Castle) and A80D (courses cleared) are from Data Crystal's RAM map
# (datacrystal.tcrf.net, Wario Land: Super Mario Land 3/RAM map); the courses
# per world and the ending's money steps from the Super Mario Wiki.
[game]
system = gb
title = Wario Land: Super Mario Land 3
codes = SUPERMARIOLAND3

[companion]
note = Your coins, lives and the time appear in a course

[hud]
# In a course (mode 03 at A8C3) with the status bar where the game keeps it:
# the window layer at line 136 (the pause screen raises it to 128).
on = mem8[A8C3] == 03 and mem8[FF4A] == 88
strip = 0 136 160 8

[view.course]
format = board
# the game's own names, as the top screen writes them
proper = Rice Beach; Mt. Teapot; Sherbet Land; Stove Canyon; SS Tea Cup; Parsley Woods; Syrup Castle; Birdhouse; Tree trunk; Log cabin; Pagoda; Castle
# in a course
on = mem8[A8C3] == 03
# the board takes the status bar's place rather than sitting over it
covers_hud = yes
heading = In a course
heading_art = lives
art.lives = gb 11:73E0 1x1
art.coin = gb 11:73F0 1x1
art.heart = gb 11:73A0 1x1
art.time = gb 11:7390 1x1
tile1 = Coins | bcd A97A 2 art coin page Course
tile2 = Time | bcd A964 2 art time
tile3 = Lives | bcd A809 1 art lives
tile4 = Hearts | bcd A808 1 of 100 art heart
tile5 = Treasures | bits A80E 2 wide of 15 icon treasure
tile6 = Coin bank | bcd A805 3 wide icon bank
tile7 = Ending so far | bcd A805 3 wide tiers icon trophy page Worlds
tiers7 = 300 Birdhouse; 10072 Tree trunk; 40008 Log cabin; 70008 Pagoda; 90008 Castle
tile8 = Rice Beach | bits A80B 1 of 6 icon flag page Worlds
tile9 = Mt. Teapot | bits A80C 1 of 7 icon flag
tile10 = Sherbet Land | bits A813 1 of 6 icon flag
tile11 = Stove Canyon | bits A810 1 of 6 icon flag
tile12 = SS Tea Cup | bits A811 1 of 5 icon flag
tile13 = Parsley Woods | bits A812 1 of 6 icon flag
tile14 = Syrup Castle | bits A814 1 of 4 icon flag

[view.map]
format = board
# the game's own names, as the top screen writes them
proper = Rice Beach; Mt. Teapot; Sherbet Land; Stove Canyon; SS Tea Cup; Parsley Woods; Syrup Castle; Birdhouse; Tree trunk; Log cabin; Pagoda; Castle
# on the world map
on = mem8[A8C3] == 01
heading = Your journey
heading_art = lives
art.lives = gb 11:73E0 1x1
art.heart = gb 11:73A0 1x1
tile1 = Lives | bcd A809 1 art lives page Journey
tile2 = Hearts | bcd A808 1 of 100 art heart
tile3 = Coin bank | bcd A805 3 icon bank
tile4 = Treasures | bits A80E 2 of 15 icon treasure
tile5 = Ending so far | bcd A805 3 wide tiers icon trophy
tiers5 = 300 Birdhouse; 10072 Tree trunk; 40008 Log cabin; 70008 Pagoda; 90008 Castle
tile6 = Rice Beach | bits A80B 1 of 6 icon flag page Worlds
tile7 = Mt. Teapot | bits A80C 1 of 7 icon flag
tile8 = Sherbet Land | bits A813 1 of 6 icon flag
tile9 = Stove Canyon | bits A810 1 of 6 icon flag
tile10 = SS Tea Cup | bits A811 1 of 5 icon flag
tile11 = Parsley Woods | bits A812 1 of 6 icon flag
tile12 = Syrup Castle | bits A814 1 of 4 icon flag
