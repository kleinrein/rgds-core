# Wario Land II (USA, Europe). A board on the second screen in a level: the
# coins Wario carries, as the corner counter shows them, and the coin total
# the game otherwise shows only between levels. The cart has no game code,
# so the header title names it. No disassembly exists: found by playing and
# from the ROM. 1D18 adds into the total at C50B-C50D (BCD, capped at
# 99999); the counter is C50E-C50F (BCD); C002 is the game's mode, 06 in a
# level (paused too).
[game]
system = gb
title = Wario Land II
codes = WARIOLAND2

[companion]
note = Your coins appear in a level

[view]
format = board
on = mem8[C002] == 06
heading = Coins
heading_icon = coin
tile1 = Carried | bcd C50E 2 icon coin
tile2 = Total | bcd C50B 3 icon bank
