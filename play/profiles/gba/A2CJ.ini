# Castlevania: Akatsuki no Minuet (Japan); its data sits 0x30 lower than the USA release.. SELECT opens the castle map.
# Memory and pixel facts first found by kyannon's GBA DS (GPL-3.0,
# https://github.com/kyannon/gba-ds), checked there against the USA release.
# Not yet checked with RG DS Play on a real cartridge dump.
[game]
title = Castlevania: Aria of Sorrow
codes = A2CJ

[companion]
interval = 90

[map]
open = SELECT:4
timeout = 150
stable = 3
max_diff = 160
ready = mem8[03002C38] == 02
# the dark purple field in the corners; three of four, so a room drawn into
# one corner cannot break the check
pixels = 1,1=#29007B 238,1=#29007B 1,158=#29007B 238,158=#29007B
pixels_min = 3
tolerance = 8
background = #29007B
min_foreground = 12
# the save and warp rooms glow on an 84-frame pulse
anim_frames = 8
anim_step = 4
