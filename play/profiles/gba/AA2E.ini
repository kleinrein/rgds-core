# Super Mario Advance 2: Super Mario World (USA, Europe).
# In a level the status bar (lives, Dragon Coins, time, coins, score) leaves
# the game screen for a board on the second screen, each piece the game's own
# drawing in a card; the blue item box, message boxes and the pause box stay
# on the game screen. HUD boxes (Yoshi's House, European release): Mario and
# lives 12,0 28x8 (the Dragon Coins under them), bonus stars 64,0 32x16, time
# 144,0 24x16, coins 193,0 40x8, score right-aligned in 168,8 64x8. On the world map the second screen shows the SELECT
# menu: the island's levels with time and score.
# Memory facts first found by kyannon's GBA DS (GPL-3.0,
# https://github.com/kyannon/gba-ds); checked with RG DS Play on the European
# release (AA2P).
[game]
title = Super Mario Advance 2: Super Mario World
codes = AA2E AA2P

[companion]
# The game mode (the SNES game's plus 0x10): 1E on the world map, here not
# paused (03002C74 = 2) and with the map's own display (3E00).
live = mem8[03002BC6] == 1E and mem16[04000000] == 3E00 and mem8[03002C74] == 02
# the title, game select and file screens
menu = mem8[03002BC6] in 00..17
interval = 120

[map]
open = SELECT:4
timeout = 90
stable = 3
max_diff = 400
# the SELECT menu's own display: BG0-2 and sprites
ready = mem16[04000000] == 1700
anim_frames = 8
anim_step = 8

[hud]
# In a level (mode 24, paused too) the status bar is BG3 (DC44 at any
# priority) and BG3 is on.
on = mem8[03002BC6] == 24 and mem16[0400000E] & FFFC == DC44 and mem16[04000000] & 0800 == 0800
# through doors and pipes (the fade and the next room loading) the last bar stays
keep = mem8[03002BC6] in 1F..24
bg = 8
sprites = none
backdrop = theme
# the item box (the item in it is a sprite and stays anyway), and BG3 below
# the bar: message boxes and the pause box
to_game = 104 0 32 16 > 104 0
to_game = 0 16 240 144 > 0 16

[view]
format = board
on = mem8[03002BC6] == 24 and mem16[0400000E] & FFFC == DC44 and mem16[04000000] & 0800 == 0800
covers_hud = yes
heading = In a level
heading_art = mario
art.mario = hud 12 0 8 8
tile1 = Lives | hud 12 0 40 16
tile2 = Bonus stars | hud 64 0 32 16
tile3 = Time | hud 144 0 24 16
tile4 = Coins | hud 193 0 40 8
tile5 = Score | hud 168 8 64 8 wide
