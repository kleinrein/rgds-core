# Castlevania: Circle of the Moon (USA, Europe, Japan). SELECT opens the map.
# Memory and pixel facts first found by kyannon's GBA DS (GPL-3.0,
# https://github.com/kyannon/gba-ds), checked there against the USA release.
# Checked with RG DS Play on the USA release.
[game]
title = Castlevania: Circle of the Moon
codes = AAME AAMP AAMJ

[companion]
# 0 in play, 1 on the map screen
live = mem8[03000C80] == 00
interval = 90

[map]
open = SELECT:4
timeout = 150
stable = 3
max_diff = 160
ready = mem8[03000C80] == 01
pixels = 1,1=#000000 238,1=#000000 1,158=#000000 238,158=#000000
pixels_min = 3
tolerance = 8
background = #000000
min_foreground = 8
anim_frames = 8
anim_step = 4
