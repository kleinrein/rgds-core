# Castlevania: Byakuya no Concerto (Japan); its data sits 0x30 lower than the USA release.. SELECT opens the castle map.
# Memory and pixel facts first found by kyannon's GBA DS (GPL-3.0,
# https://github.com/kyannon/gba-ds), checked there against the USA release.
# Not yet checked with RG DS Play on a real cartridge dump.
[game]
title = Castlevania: Harmony of Dissonance
codes = ACHJ

[companion]
interval = 90

[map]
open = SELECT:4
timeout = 150
stable = 3
max_diff = 160
ready = mem8[03002AF8] == 02
# black in the corners and the top middle; three of four
pixels = 1,1=#000000 238,158=#000000 1,158=#000000 120,1=#000000
pixels_min = 3
tolerance = 8
background = #000000
min_foreground = 12
# the save and warp rooms glow on a 64-frame pulse
anim_frames = 8
anim_step = 3
