# Fire Emblem (USA, Europe). On the battle map the windows move to the second
# screen: the unit and terrain windows under the cursor, the goal window, the
# action and weapon menus with the unit's portrait and battle stats, and the
# battle forecast. The game screen keeps the map, the units and the movement
# ranges. Found with RG DS Play on the European release (AE7X).
[game]
title = Fire Emblem
codes = AE7E AE7X

[hud]
# The battle map: mode 0 with all four layers and sprites, the map on BG2
# (0E02) and BG3 (0F0B). The battle scenes and the story screens use others.
# The language screen sets the layers up the same way, so the first unit of
# the unit table (0202BD50, a pointer into the ROM once a chapter is loaded;
# zero before) must be there too.
on = mem16[04000000] & 1F07 == 1F00 and mem16[0400000C] == 0E02 and mem16[0400000E] == 0F0B and mem8[0202BD53] == 08
keep = mem16[0400000C] == 0E02
# the text (BG0) and the window boxes (BG1)
bg = 3
sprites = none
# the menus' pointing hand (tile 0, priority 0) and the portrait beside the
# weapon menu (768-863, priority 2) go with them
sprite_tiles = 0-0 0
sprite_tiles = 768-863 2
backdrop = theme