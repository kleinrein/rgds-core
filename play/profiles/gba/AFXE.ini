# Final Fantasy Tactics Advance (USA, Europe). In battles and the scenes
# played on the battle maps (the opening snowball fight too), what the game
# draws over the map moves to the second screen: the unit panel with its
# portrait, dialogue with its portraits, the command menus and banners. The
# game screen keeps the map, the units and the height readout. Display facts
# first found by kyannon's GBA DS (GPL-3.0, https://github.com/kyannon/gba-ds),
# which also patches the ROM to tell the menus' sprites apart; RG DS Play uses
# GBA DS's tile ranges alone. Checked with RG DS Play on the European release
# (AFXP).
[game]
title = Final Fantasy Tactics Advance
codes = AFXE AFXP

[hud]
# Battles: mode 0 with sprites on, and the map's layer (BGxCNT 4C03) shown.
on = mem16[04000000] & 1007 == 1000
map_cnt = 4C03
keep = mem16[04000000] & 1007 == 1000
# The game moves the map and its menus between layers: the HUD is whatever
# sits at priority 0-1 (the map is at 2-3).
bg_priority_below = 2
sprites = none
# the portraits, panels, name entry and banners (448 and up), and the hand
# cursor and the menus' orb (288-295 at priority 0); the units, the markers
# on the map and the height readout (428-447) stay
sprite_tiles = 448-1023
sprite_tiles = 288-295 0
backdrop = game
