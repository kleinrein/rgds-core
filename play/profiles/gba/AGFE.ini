# Golden Sun: The Lost Age (USA, Europe). The party on the second screen,
# live: each Adept's name, level, HP and PP, as for Golden Sun. Found with RG
# DS Play on the USA/Europe release: the party flags at 02000040 (bit n:
# character n) and the characters' 0x14C-byte records from 02000520, where
# the four Adepts of the first game come first (Isaac, Garet, Ivan, Mia),
# then Felix, Jenna, Sheba and Piers.
[game]
title = Golden Sun: The Lost Age
codes = AGFE AGFP

