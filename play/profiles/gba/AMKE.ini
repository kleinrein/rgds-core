# Mario Kart: Super Circuit (USA, Europe; Mario Kart Advance, Japan).
# The race HUD (coins, laps, time, the top four, the course map) moves to the
# second screen. The register and VRAM facts were first found by kyannon's
# GBA DS (GPL-3.0, https://github.com/kyannon/gba-ds).
[game]
title = Mario Kart: Super Circuit
codes = AMKE AMKP AMKJ

[hud]
# Racing: display mode 1 with BG0 on (DISPCNT 1F41 while racing), BG0's map
# in screen block 7, the LAP label in BG0's top bar and two cells the results
# table fills still empty. Only the bits that say so are compared, so a flash
# or a window the game turns on for an item cannot switch the HUD back. The
# pause menu (BG0 from block 6), the lap times, the results and TRY AGAIN /
# NEXT RACE after the finish are drawn on BG0 too: they stay on the game
# screen, where they can be read and chosen, and the race's last HUD stays up
# below.
on = mem16[04000000] & 0107 == 0101 and mem16[04000008] & 1F00 == 0700 and mem16[06003808] == C044 and mem16[0600384A] == C048 and mem16[06003AC8] == 0 and mem16[06003B10] == 0
keep = mem16[04000000] & 0107 == 0101
# The HUD is BG0; the racers' dots on the course map are the only
# priority-0 sprites (karts and Lakitu are priority 1).
bg = 1
sprites = 0
backdrop = game
# The item box and your place stay where you look while racing: the item box
# in the game screen's top left, the place in its top right.
to_game = 104 0 33 29 > 4 4
to_game = 0 120 61 40 > 175 4
# Behind the HUD on the second screen: the sky and scenery above the horizon
# (the track starts at row 76).
backdrop_rows = 76
# drawn by the silent copy with BG1-3 only: no karts, no Lakitu, no HUD
backdrop_layers = E
# The second screen while racing, in a 640x480 panel's coordinates: coins and
# lap top left, time top right, the top four down the left, and the course
# map (trimmed to each course's shape) as large as the rest allows.
panel = 0 2 94 14 > 16 18 300 44
panel = 146 0 94 16 > 324 16 300 48
panel = 2 18 32 102 > 16 84 104 380 trim
panel = 140 64 100 96 > 136 84 488 380 trim
