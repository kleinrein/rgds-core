# Metroid Fusion (Japan); its data sits 0x34 higher than the USA release.. The pause screen is the map: START opens it.
# Memory and pixel facts first found by kyannon's GBA DS (GPL-3.0,
# https://github.com/kyannon/gba-ds), checked there against the USA release.
# Not yet checked with RG DS Play on a real cartridge dump.
[game]
title = Metroid Fusion
codes = AMTJ

[companion]
# 1 while Samus is in play, 3 on the pause/map screen
live = mem8[03000C12] == 01
interval = 90

[map]
open = START:4
timeout = 180
stable = 3
max_diff = 640
ready = mem8[03000C12] == 03
# the grey bezel corners and the white edges of the map frame
pixels = 0,0=#9C9C9C 239,0=#9C9C9C 0,159=#9C9C9C 239,159=#9C9C9C 2,80=#FFFFFF 237,80=#FFFFFF
tolerance = 8
background = #9C9C9C
anim_frames = 8
anim_step = 4
