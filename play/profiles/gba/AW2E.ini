# Advance Wars 2: Black Hole Rising (USA, Europe). As Advance Wars: on the
# battle map the commander's panel (funds, power meter) and the terrain
# details leave the game screen for a board on the second screen, each panel
# large in its own card; the game screen keeps the map, the units and the
# cursor. Found with RG DS
# Play on the European release (AW2P).
[game]
title = Advance Wars 2: Black Hole Rising
codes = AW2E AW2P

[hud]
# The battle map: BG0-3, sprites and window 0 on (3F60), the map on BG2 (0F09).
on = mem16[04000000] & 3F00 == 3F00 and mem16[0400000C] == 0F09
keep = mem16[0400000C] == 0F09
bg = 0
sprites = none
# The panels are sprites at priority 0 like the cursor (tiles 849-876), told
# apart by their tiles: the commander panel 0-127, the terrain and unit
# pictures 400-520, the numbers 900 and up.
sprite_tiles = 0-127
sprite_tiles = 400-520
sprite_tiles = 900-1023
window_effects_off = 1
backdrop = theme

[view]
format = board
on = mem16[04000000] & 3F00 == 3F00 and mem16[0400000C] == 0F09
covers_hud = yes
# the panels sit on the side away from the cursor: either box
tile1 = Commander | hud 160 0 80 36 or 0 0 80 36 wide tall
tile2 = Terrain and unit | hud 160 96 80 64 or 0 96 80 64 wide tall
