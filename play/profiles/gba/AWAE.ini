# Wario Land 4 (USA, Europe). In a level the hearts and the coin counter leave
# the game screen (which keeps Wario and the room) for a board on the second
# screen: the game's own hearts, heart gauge and coin counter drawn large in
# cards. Found with RG DS Play on the USA/Europe release. Nothing the game
# keeps in memory is shown yet: the hearts are 03001910 (Data Crystal's
# "lives", datacrystal.tcrf.net, Wario Land 4/RAM map; 4 in the Hall of
# Hieroglyphs), but the jewel pieces, CD and Keyzer were not found (poking
# memory breaks the pause screen that shows them). HUD boxes: hearts and gauge
# 9,7 64x14, coins 179,6 57x8.
[game]
title = Wario Land 4
codes = AWAE AWAP

[hud]
# In a level: the screen blocks of BG0 and BG3 (4006, 460B) and sprites on.
on = mem16[04000008] == 4006 and mem16[0400000E] == 460B and mem16[04000000] & 1000 == 1000
keep = mem16[04000008] == 4006 and mem16[0400000E] == 460B
bg = 0
sprites = none
# the hearts and the counters are priority 0 sprites on tiles 128-215; Wario
# and the room's own sprites are priority 1 and up
sprite_tiles = 128-215 0
backdrop = theme

[view]
format = board
on = mem16[04000008] == 4006 and mem16[0400000E] == 460B and mem16[04000000] & 1000 == 1000
covers_hud = yes
heading = Wario Land 4
heading_art = coin
proper = Wario Land 4
art.coin = hud 179 6 8 8
tile1 = Hearts | hud 9 7 64 14 wide
tile2 = Coins | hud 179 6 57 8 wide
