# Wario Land 4 (USA, Europe). In a level the hearts and the coin counter move
# to the second screen, at twice the size; the game screen keeps Wario and the
# room. Found with RG DS Play on the USA/Europe release.
[game]
title = Wario Land 4
codes = AWAE AWAP

[hud]
# In a level: the screen blocks of BG0 and BG3 (4006, 460B) and sprites on.
on = mem16[04000008] == 4006 and mem16[0400000E] == 460B and mem16[04000000] & 1000 == 1000
keep = mem16[04000008] == 4006 and mem16[0400000E] == 460B
bg = 0
sprites = none
# the hearts and the counters are priority 0 sprites on tiles 128-215; Wario
# and the room's own sprites are priority 1 and up
sprite_tiles = 128-215 0
backdrop = theme
panel = 0 0 240 28 > 16 24 608 72
