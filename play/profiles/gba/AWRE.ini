# Advance Wars (USA, Europe). On the battle map the commander's panel (day,
# funds, power meter) and the terrain and unit details leave the game screen
# for a board on the second screen, each panel large in its own card (the
# game draws them on the side away from the cursor, at 3,3 and 6,98 or 160,3
# and 205,98); the game screen keeps the map, the units and the cursor. Found with RG DS Play on the European
# release (AWRP).
[game]
title = Advance Wars
codes = AWRE AWRP

[hud]
# The battle map: BG0-3, sprites and window 0 on (3F40), the map on BG2 (0F09).
on = mem16[04000000] & 3F00 == 3F00 and mem16[0400000C] == 0F09
keep = mem16[0400000C] == 0F09
bg = 0
sprites = none
# The panels are sprites at priority 0 like the cursor (tiles 872-876), told
# apart by their tiles: the commander panel 0-127, the terrain and unit
# pictures 280-400, the text and numbers 900 and up.
sprite_tiles = 0-127
sprite_tiles = 280-400
sprite_tiles = 900-1023
# the shade window 0 puts behind the terrain panel goes too
window_effects_off = 1
backdrop = theme

[view]
format = board
on = mem16[04000000] & 3F00 == 3F00 and mem16[0400000C] == 0F09
covers_hud = yes
# the panels sit on the side away from the cursor: either box
tile1 = Commander | hud 160 0 80 36 or 0 0 80 36 wide tall
tile2 = Terrain and unit | hud 160 96 80 64 or 0 96 80 64 wide tall
