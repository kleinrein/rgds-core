# Super Mario Advance 4: Super Mario Bros. 3 (USA, Europe).
# In a level the status line (world, lives, time, coins, score) leaves the
# game screen for a board on the second screen, each piece the game's own
# drawing in a card, with the items you carry on a second page; the P-meter
# stays at the bottom of the game screen, where you look while running. On
# the world map the board has the world, lives and coins, and the item
# inventory counted by kind (the game shows it only behind B). Found with
# RG DS Play on the European release (AX4P); the US release draws the same way.
# Data Crystal's RAM map (datacrystal.tcrf.net, Super Mario Advance 4: Super
# Mario Bros. 3/RAM map, USA) holds for the European release: the world
# 03002A69 (00 = World 1), Mario's lives 03002A6A (one less than shown: 04
# for 5), his coins 03002C58 and his 36 inventory slots 03002C2E-03002C51,
# checked by poking items 01-0D into the slots and opening the inventory (01
# Mushroom, 02 Fire Flower, 03 Super Leaf, 04 Frog Suit, 05 Tanooki Suit, 06
# Hammer Suit, 07 Lakitu's Cloud, 08 P-Wing, 09 Starman, 0A Anchor, 0B
# Hammer, 0C Warp Whistle, 0D Music Box). Luigi's own (03002C59) is not
# shown. HUD boxes in a level: WORLD 7,0 33x8; Mario and lives 51,0 38x8;
# time 104,0 32x8; coins 145,0 24x8; score 176,0 56x8.
[game]
title = Super Mario Advance 4: Super Mario Bros. 3
codes = AX4E AX4P

[hud]
# A level: display mode 1 with BG0-3 and sprites on (1F00 and up; the world
# map is 1300), the status line on BG0 from screen block 20 at priority 0.
on = mem16[04000000] & 0F07 == 0F00 and mem16[04000008] == 9400
keep = mem16[04000008] == 9400
bg = 1
sprites = none
backdrop = theme
# the P-meter along the bottom
to_game = 0 140 240 20 > 0 140

[view.level]
format = board
on = mem16[04000000] & 0F07 == 0F00 and mem16[04000008] == 9400
covers_hud = yes
heading = In a level
heading_art = mario
art.mario = hud 51 0 12 8
tile1 = World | hud 7 0 33 8 page Level
tile2 = Lives | hud 51 0 38 8
tile3 = Time | hud 104 0 32 8
tile4 = Coins | hud 145 0 24 8
tile5 = Score | hud 176 0 56 8 wide
tile6 = Mushroom | count 03002C2E 36 is 01 icon life page Items
tile7 = Fire Flower | count 03002C2E 36 is 02 icon spark
tile8 = Super Leaf | count 03002C2E 36 is 03 icon shield
tile9 = Tanooki Suit | count 03002C2E 36 is 05 icon shield
tile10 = Frog Suit | count 03002C2E 36 is 04 icon shield
tile11 = Hammer Suit | count 03002C2E 36 is 06 icon shield
tile12 = P-Wing | count 03002C2E 36 is 08 icon play
tile13 = Starman | count 03002C2E 36 is 09 icon star
proper = Mario; Mushroom; Fire Flower; Super Leaf; Tanooki Suit; Frog Suit; Hammer Suit; P-Wing; Starman; Lakitu's Cloud; Anchor; Hammer; Warp Whistle; Music Box

[view.map]
format = board
# the world map (and the inventory over it)
on = mem16[04000000] == 1300 and mem8[03002A69] in 00..08
heading = World map
heading_icon = map
tile1 = World | num 03002A69 1 plus 1 icon map page Mario
tile2 = Lives | num 03002A6A 2 plus 1 icon life
tile3 = Coins | num 03002C58 1 icon coin
tile5 = Mushroom | count 03002C2E 36 is 01 icon life page Items
tile6 = Fire Flower | count 03002C2E 36 is 02 icon spark
tile7 = Super Leaf | count 03002C2E 36 is 03 icon shield
tile8 = Tanooki Suit | count 03002C2E 36 is 05 icon shield
tile9 = Frog Suit | count 03002C2E 36 is 04 icon shield
tile10 = Hammer Suit | count 03002C2E 36 is 06 icon shield
tile11 = P-Wing | count 03002C2E 36 is 08 icon play
tile12 = Starman | count 03002C2E 36 is 09 icon star
tile13 = Lakitu's Cloud | count 03002C2E 36 is 07 icon moon page Tools
tile14 = Anchor | count 03002C2E 36 is 0A icon key
tile15 = Hammer | count 03002C2E 36 is 0B icon sword
tile16 = Warp Whistle | count 03002C2E 36 is 0C icon flag
tile17 = Music Box | count 03002C2E 36 is 0D icon sleep
proper = Mario; Mushroom; Fire Flower; Super Leaf; Tanooki Suit; Frog Suit; Hammer Suit; P-Wing; Starman; Lakitu's Cloud; Anchor; Hammer; Warp Whistle; Music Box
