# The Legend of Zelda: A Link to the Past & Four Swords (USA, Europe, Japan).
# L brings up the world map outdoors, and the dungeon map once Link has it.
# Where L does nothing (houses, caves), the last map stays up, dimmed. Four
# Swords needs linked GBAs; maps are only taken while A Link to the Past runs.
# Memory and pixel facts first found by kyannon's GBA DS (GPL-3.0,
# https://github.com/kyannon/gba-ds), checked there against the USA release.
# Checked with RG DS Play on the European release (AZLP).
[game]
title = The Legend of Zelda: A Link to the Past
codes = AZLE AZLP AZLJ

[companion]
# A Link to the Past is running (1 on the cartridge's shared menus and in
# Four Swords), in normal play (9 outdoors, 7 indoors), not mid transition
live = mem8[03000010] == 02 and mem8[03002BDC] == 09 | 07 and mem8[03002BDD] == 00
menu = mem8[03000010] == 01
interval = 90
dim_when_unavailable = yes

[map]
open = L:4
timeout = 150
# long enough to outlast the black frames before the map is drawn
stable = 12
max_diff = 300
# the game's main mode, as on the SNES: 0E, with sub-mode 7 the world map, 3 a dungeon map
ready = mem8[03002BDC] == 0E and mem8[03002BDD] == 07 | 03
# not still black: dark dungeon maps sit on black for a few frames first
background = #000000
min_foreground = 2000
tolerance = 8
anim_frames = 8
anim_step = 4
