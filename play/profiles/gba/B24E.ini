# Pokémon Mystery Dungeon: Red Rescue Team (USA, Europe). In a dungeon the
# floor's map and the status line (floor, level, HP) move to the second
# screen, as on the DS games' top screen: the map grows as you explore, with
# its markers. The game screen keeps the dungeon and the Pokémon. Found with
# RG DS Play on the European release (B24P).
[game]
title = Pokémon Mystery Dungeon: Red Rescue Team
codes = B24E B24P

[hud]
# A dungeon floor: BG0 is the status line and the map (0C00), the floor
# itself BG3 (2F0B); towns and menus set the layers up otherwise.
on = mem16[04000008] == 0C00 and mem16[0400000E] == 2F0B and mem16[04000000] & 0100 == 0100
keep = mem16[0400000E] == 2F0B
bg = 1
sprites = none
# your marker on the map (tile 533 at priority 0; the shadows under the
# Pokémon use 520 at priority 3 and stay)
sprite_tiles = 528-543 0
backdrop = 0C111A
