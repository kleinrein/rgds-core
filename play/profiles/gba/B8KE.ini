# Kirby & the Amazing Mirror (USA, Europe). In play the HUD leaves the game
# and the second screen is a board in its place: the copy ability as the game
# writes it, health against its most, lives, the phone's battery and the
# Mirror shards; a Friends page has the three helper Kirbys' abilities and
# health, which the game only shows when you call them. Found with RG DS Play
# on the European release (B8KP).
# Each Kirby is a 0x1A8-byte record from 02020FE0 (pink, then yellow, red,
# green): health, its most, lives, ability. Data Crystal's RAM map
# (datacrystal.tcrf.net, Kirby & the Amazing Mirror/RAM map) gives the
# abilities (02020FE3 + 0x1A8 each, values 00 Normal to 1A Master) and the
# battery (02020FBC); the European CodeBreaker codes give health, its most and
# lives (02020FE0-02020FE2), all read back in the first area (6 of 6, 2 lives,
# battery 3). The Mirror shards as bits of 02038970 come from the "completed
# Mirror" code alone and were not checked on a save that has any.
# The HUD boxes: the ability's name 0,145 40x14, Kirby's face 57,145.
[game]
title = Kirby & the Amazing Mirror
codes = B8KE B8KP

[companion]
note = Your ability, health and helpers appear here while you play

[hud]
# In play the HUD is BG1 (1C04: screen block 28, priority 0) and BG1 is on;
# the title and menu screens set BG1 up differently.
on = mem16[0400000A] == 1C04 and mem16[04000000] & 0200 == 0200
keep = mem16[0400000A] == 1C04
bg = 2
sprites = none
backdrop = theme

[view]
format = board
on = mem16[0400000A] == 1C04 and mem16[04000000] & 0200 == 0200
covers_hud = yes
heading = Kirby
heading_art = face
proper = Kirby; Normal; Fire; Ice; Burning; Wheel; Parasol; Cutter; Beam; Stone; Bomb; Throw; Sleep; Cook; Laser; UFO; Spark; Tornado; Hammer; Sword; Cupid; Fighter; Magic; Smash; Mini; Crash; Missile; Master; Yellow Kirby; Red Kirby; Green Kirby
art.face = hud 57 145 14 14
tile1 = Copy ability | hud 0 145 40 14 page Kirby
tile2 = Health | num 02020FE0 1 max 02020FE1 icon heart
tile3 = Lives | num 02020FE2 1 art face
tile4 = Phone battery | num 02020FBC 1 of 3 icon battery
tile5 = Mirror shards | bits 02038970 1 of 8 wide icon gem
tile6 = Yellow Kirby | num 0202118B 1 names icon star page Friends
tiers6 = 0 Normal; 1 Fire; 2 Ice; 3 Burning; 4 Wheel; 5 Parasol; 6 Cutter; 7 Beam; 8 Stone; 9 Bomb; 10 Throw; 11 Sleep; 12 Cook; 13 Laser; 14 UFO; 15 Spark; 16 Tornado; 17 Hammer; 18 Sword; 19 Cupid; 20 Fighter; 21 Magic; 22 Smash; 23 Mini; 24 Crash; 25 Missile; 26 Master
tile7 = Health | num 02021188 1 max 02021189 icon heart
tile8 = Red Kirby | num 02021333 1 names icon star
tiers8 = 0 Normal; 1 Fire; 2 Ice; 3 Burning; 4 Wheel; 5 Parasol; 6 Cutter; 7 Beam; 8 Stone; 9 Bomb; 10 Throw; 11 Sleep; 12 Cook; 13 Laser; 14 UFO; 15 Spark; 16 Tornado; 17 Hammer; 18 Sword; 19 Cupid; 20 Fighter; 21 Magic; 22 Smash; 23 Mini; 24 Crash; 25 Missile; 26 Master
tile9 = Health | num 02021330 1 max 02021331 icon heart
tile10 = Green Kirby | num 020214DB 1 names icon star
tiers10 = 0 Normal; 1 Fire; 2 Ice; 3 Burning; 4 Wheel; 5 Parasol; 6 Cutter; 7 Beam; 8 Stone; 9 Bomb; 10 Throw; 11 Sleep; 12 Cook; 13 Laser; 14 UFO; 15 Spark; 16 Tornado; 17 Hammer; 18 Sword; 19 Cupid; 20 Fighter; 21 Magic; 22 Smash; 23 Mini; 24 Crash; 25 Missile; 26 Master
tile11 = Health | num 020214D8 1 max 020214D9 icon heart
