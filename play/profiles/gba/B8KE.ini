# Kirby & the Amazing Mirror (USA, Europe). In play the HUD moves to the
# second screen at twice the size: the copy ability, lives and health along
# the bottom, the phone's battery (calls for help) in the corner, and boss
# health when there is one. Found with RG DS Play on the European release
# (B8KP). The area map needs the Map from a big chest; it is not captured.
[game]
title = Kirby & the Amazing Mirror
codes = B8KE B8KP

[hud]
# In play the HUD is BG1 (1C04: screen block 28, priority 0) and BG1 is on;
# the title and menu screens set BG1 up differently.
on = mem16[0400000A] == 1C04 and mem16[04000000] & 0200 == 0200
keep = mem16[0400000A] == 1C04
bg = 2
sprites = none
backdrop = game
