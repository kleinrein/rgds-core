# Metroid: Zero Mission (USA, Europe, Japan). The pause screen is the map: START opens it.
# Memory and pixel facts first found by kyannon's GBA DS (GPL-3.0,
# https://github.com/kyannon/gba-ds), checked there against the USA release.
# Not yet checked with RG DS Play on a real cartridge dump.
[game]
title = Metroid: Zero Mission
codes = BMXE BMXP BMXJ

[companion]
# 4 while Samus is in play, 5 on the pause/map screen
live = mem8[03000C70] == 04
interval = 90

[map]
open = START:4
timeout = 180
stable = 3
max_diff = 300
ready = mem8[03000C70] == 05
# the pale bezel corners and the dark edges of the map frame
pixels = 0,0=#CEDECE 239,0=#CEDECE 2,80=#212921 237,80=#212921
tolerance = 8
anim_frames = 8
anim_step = 4
