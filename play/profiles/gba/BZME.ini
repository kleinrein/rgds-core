# The Legend of Zelda: The Minish Cap (USA, Europe). In play the HUD leaves
# the game screen for a board on the second screen: the hearts and the rupees
# as the game draws them, the heart pieces, bombs and arrows; a Collection
# page has the Mysterious Shells, figurines, Kinstone fusions and enemies
# defeated, which the game keeps in menus or not at all. The A, B and R
# buttons, dialogue and anything else the HUD layer draws stay on the game
# screen. Found with RG DS Play on the European release (BZMP).
# The save block and its stats follow zeldaret/tmc (include/save.h, player.h):
# gSave is at 02002A40 on the European release too (the stats at +A8 read
# back health 18 of 18, three hearts, in Link's house), so heart pieces are
# 02002AE9, bombs 02002AEC, arrows 02002AED, figurines 02002AF0, rupees and
# shells the words at 02002B00 and 02002B02, enemies killed the word at
# 02002A90 and Kinstone fusions 02002B57. Only health was checked in play.
# In play the display is BG0-2 and sprites (DISPCNT 17xx) with the HUD on BG0
# (1F0C); the title, file and name screens and the story set it up otherwise.
# HUD boxes: hearts from 7,4 (two rows once there are more than ten), rupees
# 195,146 40x12 (the buttons are at 178,8 56x32).
[game]
title = The Legend of Zelda: The Minish Cap
codes = BZME BZMP

[companion]
note = Your hearts, items and rupees appear here while you play

[hud]
on = mem16[04000008] == 1F0C and mem16[04000000] & 1F00 == 1700
keep = mem16[04000008] == 1F0C and mem16[04000000] & 1F00 == 1700
bg = 1
sprites = none
# the button icons (256-287) and the heart that beats (288-295), priority 0
sprite_tiles = 256-295 0
backdrop = theme

[view]
format = board
# and Link has hearts (the opening walk to Hyrule Town comes before the save block)
on = mem16[04000008] == 1F0C and mem16[04000000] & 1F00 == 1700 and mem8[02002AEB] != 00
covers_hud = yes
heading = Link
heading_art = rupee
proper = Link; Kinstone; Mysterious Shells
art.rupee = hud 195 146 10 12
tile1 = Hearts | hud 7 4 90 20 wide page Link
tile2 = Rupees | hud 195 146 40 12
tile3 = Heart pieces | num 02002AE9 1 of 4 icon heart
tile4 = Bombs | num 02002AEC 1 icon spark
tile5 = Arrows | num 02002AED 1 icon sword
tile6 = Mysterious Shells | num 02002B02 2 icon treasure page Collection
tile7 = Figurines | num 02002AF0 1 of 136 icon trophy
tile8 = Kinstone fusions | num 02002B57 1 of 100 icon gem
tile9 = Enemies defeated | num 02002A90 4 icon shield
