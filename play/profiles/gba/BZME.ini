# The Legend of Zelda: The Minish Cap (USA, Europe). In play the HUD moves to
# the second screen at twice the size: the hearts, the A, B and R buttons
# with their items, the rupees, and what the game writes on the HUD layer
# (dialogue among it). Found with RG DS Play on the European release (BZMP).
# The pause menu's map is not captured yet: it opens only once Link carries
# items, and remembers the page last seen.
[game]
title = The Legend of Zelda: The Minish Cap
codes = BZME BZMP

[hud]
# In play the HUD is BG0 (1F0C: screen block 31, priority 0) and BG0 is on.
on = mem16[04000008] == 1F0C and mem16[04000000] & 0100 == 0100
keep = mem16[04000008] == 1F0C
bg = 1
sprites = none
# the button icons (256-287) and the heart that beats (288-295), priority 0
sprite_tiles = 256-295 0
backdrop = game
