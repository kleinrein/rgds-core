# RG DS Play test cartridge (play/tests/testrom). Not a real game: it exists so
# the companion screen can be tested end to end without anyone's ROMs.
[game]
title = Play Test Rooms
codes = ZRDT

[companion]
live = mem8[02000000] == 1
menu = mem8[02000000] == 0
room = mem16[02000002]
interval = 90

[map]
open = SELECT:2
timeout = 60
stable = 3
max_diff = 200
ready = mem8[02000000] == 3
pixels = 1,1=#29007B 238,1=#29007B 1,158=#29007B 238,158=#29007B
pixels_min = 3
background = #29007B
min_foreground = 200
crop = 32 24 176 112
anim_frames = 8
anim_step = 4
