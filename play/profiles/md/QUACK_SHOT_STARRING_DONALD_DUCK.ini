# QuackShot Starring Donald Duck (Mega Drive). The second screen draws a map of
# each place Donald explores, from the game's own picture, Donald blinking on
# it, so the way back to a door or a missed item stays in sight;
# under it the status bar (power, temper, lives, the plunger and the points),
# moved off the game so the game fills the top screen. The switch shows a board
# of the numbers.
# RAM facts found on the World Rev A cartridge through PicoDrive (no public
# RAM map): FFFF1B the game's state (01 playing, 04 the item menu, 00 the
# world map, 05 the title), FF8F97 power (lit hearts, of 8), FF8F99 lives,
# FF8F9B temper (chili faces, of 5), FF8F90 popcorn and FF8F92 bubble gum
# (words; FFEEE7 is set once the bubble gum gun is found, and the item menu
# lists it from then on), FFEF36 points in tens; Donald at FFA2D0 (x) /
# FFA2D4 (y), FFA2CE set while he dies; the camera at FF8FB4 (x) / FF8FB2
# (y); FF8F35 the place picked on the world map (1 Duckburg, 2 Mexico, 3
# Transylvania) and FF8F37 the part of it. Checked in Duckburg, Mexico and
# Transylvania's forest.
[game]
system = md
title = QuackShot
codes = QUACK_SHOT_STARRING_DONALD_DUCK QUACKSHOT_STARRING_DONALD_DUCK

[companion]
note = The map of each place draws itself as Donald explores

[hud]
on = mem8[FFFF1B] == 01
strip = 0 192 320 32

[view]
format = mosaic
on = mem8[FFFF1B] == 01 | 04
area = (mem8[FF8F35] << 8) + mem8[FF8F37]
x = mem16[FF8FB4]
y = mem16[FF8FB2]
lag = 1
native = 320 224
# Above the status bar.
crop = 0 0 320 192
# Not while Donald dies: the screen fades out around a pit no one walks back to.
when = mem8[FFFF1B] == 01 and mem8[FFA2CE] == 00
player_x = mem16[FFA2D0]
player_y = mem16[FFA2D4]
scale = 4
zoom = 2
name.100 = Duckburg
name.200 = Mexico
name.201 = Mexico, the canyon
name.300 = Transylvania

[view.status]
alternative = yes
format = board
on = mem8[FFFF1B] == 01 | 04
heading = Donald
proper = Donald
tile1 = Power | num FF8F97 1 of 8 icon heart
tile2 = Temper | num FF8F9B 1 of 5 icon spark
tile3 = Points | num FFEF34 4 big times 10 icon star
tile4 = Lives | num FF8F99 1 icon life
tile5 = Popcorn | num FF8F90 2 big icon bag
tile6 = Bubble Gum | num FF8F92 2 big icon gem
