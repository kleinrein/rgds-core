# Sonic the Hedgehog (Mega Drive). The game has no map: the second screen
# draws each act from the game's own picture as Sonic runs through it, one
# map per act, Sonic blinking on it, so the loops, the paths not taken and
# the way back to a missed monitor stay in sight.
# RAM facts from the Sonic Retro disassembly (s1disasm): v_gamemode FFF600
# (0C a level, 8C its title card), v_zone FFFE10 and v_act FFFE11, the camera
# v_screenposx FFF700 / v_screenposy FFF704, Sonic's object at FFD000 (x at
# +8, y at +C), v_lives FFFE12, v_rings FFFE20, v_score FFFE26 (tens),
# v_time FFFE22 (minutes at FFFE23, seconds at FFFE24), v_shield FFFE2C,
# v_lastlamp FFFE30 (the last lamppost touched), v_emeralds FFFE57,
# v_continues FFFE18. Checked on the USA/Europe cartridge through PicoDrive.
[game]
system = md
title = Sonic the Hedgehog
codes = SONIC_THE_HEDGEHOG

[companion]
note = The map of each act draws itself as Sonic runs

[view]
format = mosaic
on = mem8[FFF600] == 0C | 8C
area = mem16[FFFE10]
x = mem16[FFF700]
y = mem16[FFF704]
# The camera in RAM is the next frame's: the game scrolls the screen in the
# vertical blank after it moves it.
lag = 1
native = 320 224
# Right of the score, time, rings and lives in the top and bottom left.
crop = 128 0 192 224
when = mem8[FFF600] == 0C
player_x = mem16[FFD008]
player_y = mem16[FFD00C]
scale = 4
zoom = 2
name.0 = Green Hill 1
name.1 = Green Hill 2
name.2 = Green Hill 3
name.100 = Labyrinth 1
name.101 = Labyrinth 2
name.102 = Labyrinth 3
name.103 = Scrap Brain 3
name.200 = Marble 1
name.201 = Marble 2
name.202 = Marble 3
name.300 = Star Light 1
name.301 = Star Light 2
name.302 = Star Light 3
name.400 = Spring Yard 1
name.401 = Spring Yard 2
name.402 = Spring Yard 3
name.500 = Scrap Brain 1
name.501 = Scrap Brain 2
name.502 = Final Zone

[view.status]
alternative = yes
format = board
on = mem8[FFF600] == 0C | 8C
heading = Sonic
proper = Sonic
tile1 = Time | num FFFE23 2 big clock icon clock
tile2 = Rings | num FFFE20 2 big icon coin
tile3 = Score | num FFFE26 4 big times 10 icon star
tile4 = Lives | num FFFE12 1 icon life
tile5 = Chaos Emeralds | num FFFE57 1 of 6 icon gem
tile6 = Shield | num FFFE2C 1 names icon shield
tiers6 = 0 Off; 1 On
tile7 = Continues | num FFFE18 1 icon battery
tile8 = Lamppost | num FFFE30 1 icon flag
