# Mario Kart 64 (N64). A map of the course seen from above, drawn from the
# path the game keeps for its computer drivers as soon as a race starts, every
# racer on it with their face, the lap and the standings beside it (the game
# shows only four places). One map per course, kept beside the save.
# RAM facts from the n64decomp/mk64 decompilation (USA): gPlayers at
# 800F6990, its place a Vec3f at +14 (x, height, z), lapCount at +08 and
# currentRank at +04 (both from 0); the course at 800DC5A0 (Skelux's MK64
# memory map). Addresses are written without the CPU's 80 (800DC5A0 is
# 0DC5A0): a profile's top bit marks a banked address.
# Checked on the handheld 29 October 2026 from a race's state: course 12
# (DK's Jungle Parkway), 800DC50C = 4 while racing, the place a float pair.
# The N64 keeps its numbers big-endian.
# The racers (decompilation, include/common_structs.h and defines.h): Player is
# DD8 bytes, type at +0 (8000 in use), characterId at +254 (0 Mario, 1 Luigi,
# 2 Yoshi, 3 Toad, 4 DK, 5 Wario, 6 Peach, 7 Bowser). Not yet checked in a race.
# The faces (decompilation, yamls/us/common_data.yml): the common data block at
# ROM 132B50, MIO0; CI8 32 x 32 with RGBA 5551 palettes. All eight unpacked from
# the USA cartridge and looked at, 2 November 2026.
[game]
system = n64
title = Mario Kart 64
codes = MARIO_KART_64 MARIOKART64

[companion]
note = The course map appears as the race starts

[view]
format = trace
# 0DC5A0: the course, 00-13; 14 is the award ceremony. 0DC50C: 4 racing
on = mem16[0DC5A0] in 0..13 and mem32[0DC50C] == 4
x = f32[0F69A4]
y = f32[0F69AC]
course = mem16[0DC5A0]
# The course from the path the computer's drivers follow (TrackWaypoint, 8
# bytes: s16 x, y, z, segment; D_80164550 the centre, D_80164560 and
# D_80164570 the left and right edges, 40 units out; gWaypointCountByPathIndex
# at D_801645C8), drawn whole as the race starts, the start line where it
# begins. A course without one (the battle arenas) is drawn as it is driven.
path = mem32[164550] & 7FFFFF
path_count = mem16[1645C8]
path_left = mem32[164560] & 7FFFFF
path_right = mem32[164570] & 7FFFFF
path_x = 0
path_y = 4
width = 50
name.0 = Mario Raceway
name.1 = Choco Mountain
name.2 = Bowser's Castle
name.3 = Banshee Boardwalk
name.4 = Yoshi Valley
name.5 = Frappe Snowland
name.6 = Koopa Troopa Beach
name.7 = Royal Raceway
name.8 = Luigi Raceway
name.9 = Moo Moo Farm
name.A = Toad's Turnpike
name.B = Kalimari Desert
name.C = Sherbet Land
name.D = Rainbow Road
name.E = Wario Stadium
name.F = Block Fort
name.10 = Skyscraper
name.11 = Double Deck
name.12 = DK's Jungle Parkway
name.13 = Big Donut
racers = 0F6990 DD8 8
racer_exists = 0 8000
racer_x = 14
racer_y = 1C
racer_rank = 4
racer_lap = 8
racer_kind = 254
laps = 3
faces = 132B50 32 32
face.0 = 1A4D8 1B6D8
face.1 = 1A6D8 1BAD8
face.2 = 1ACD8 1C6D8
face.3 = 1AAD8 1C2D8
face.4 = 1AED8 1CAD8
face.5 = 1B0D8 1CED8
face.6 = 1A8D8 1BED8
face.7 = 1B2D8 1D2D8
