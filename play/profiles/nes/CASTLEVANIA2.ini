# Castlevania II: Simon's Quest (NES). The clock the game hides: the hour and
# minute of Transylvania's day, and how many days have passed (night falls at
# 18:00 and every monster grows stronger), with Simon's hearts, level and
# experience, so the top screen keeps only the game.
# RAM facts from Data Crystal's RAM map (Castlevania II); not yet checked
# against a cartridge. A map of the towns and mansions waits for the byte
# that names the room Simon is in.
[game]
system = nes
title = Castlevania II: Simon's Quest
codes = CASTLEVANIA_II_SIMONS_QUEST CASTLEVANIA_II DRACULA_II

[companion]
note = The clock appears once Simon is on his way

[view]
format = board
# 0034: Simon is alive
on = mem8[0034] == 00
heading = Transylvania
# 0085 minutes, 0086 hours: one clock
tile1 = Time | num 0085 2 clock icon clock
tile2 = Days | num 0083 1 icon moon
tile3 = Day or night | num 0082 1 names wide icon sun
tiers3 = 0 Day; 1 Night
tile4 = Hearts | bcd 0048 2 low icon heart
tile5 = Level | num 008B 1 icon star
tile6 = Experience | bcd 0046 2 low icon trophy
