# Duck Hunt (NES). Played by touch: the game moves to the touch screen and
# the Zapper fires where a finger lands (the core's light gun on the second
# port). The other screen keeps the score, the round and the shots left.
# RAM facts from Data Crystal's RAM map (Duck Hunt); not yet checked against
# a cartridge.
[game]
system = nes
title = Duck Hunt
codes = DUCK_HUNT
lightgun = yes

[companion]
note = Tap the ducks on the touch screen

[view]
format = board
heading = Duck Hunt
proper = Duck Hunt
tile1 = Score | bcd 00C4 3 wide icon trophy
tile2 = Round | bcd 00C1 1 icon flag
tile3 = Shots | num 00BA 1 of 3 icon star
