# Metroid (NES). The game has no map at all: the second screen draws one from
# the game's own picture as Samus explores, an area at a time (Brinstar,
# Norfair, Kraid's and Ridley's hideouts, Tourian), with Samus blinking on it.
# Each screen goes where the game's map position (0050 x, 004F y) and scroll
# (00FD, 00FC) put it.
# RAM facts from Data Crystal's RAM map (Metroid); not yet checked against a
# cartridge.
[game]
system = nes
title = Metroid
codes = METROID

[companion]
note = The map draws itself as Samus explores

[view]
format = mosaic
# 001D: 0 in the game (1: the title, the password); 001E: 03 playing, 05 paused
on = mem8[001D] == 00 and mem8[001E] == 03 | 05
area = mem8[0074]
x = (mem8[0050] << 8) + mem8[00FD]
y = mem8[004F] * F0 + mem8[00FC]
native = 256 240
crop = 0 0 256 240
when = mem8[001E] == 03
player_x = (mem8[0050] << 8) + mem8[00FD] + mem8[0051]
player_y = mem8[004F] * F0 + mem8[00FC] + mem8[0052]
scale = 8
name.10 = Brinstar
name.11 = Norfair
name.12 = Kraid's hideout
name.13 = Tourian
name.14 = Ridley's hideout

[view.status]
alternative = yes
format = board
on = mem8[001D] == 00
heading = Samus
proper = Samus
tile1 = Energy tanks | num 6877 1 icon heart
tile2 = Missiles | num 6879 1 icon star
tile3 = Missile room | num 687A 1 icon bag
