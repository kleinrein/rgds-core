# The Legend of Zelda (NES). The status bar (map square, rupees, keys, bombs,
# B and A items, hearts) moves to the second screen, and above it a map of
# every screen Link has seen, drawn from the game's own picture: Hyrule as one
# map, each level as its own. The game's 16x8 grid of screens (00EB: x in
# the low nibble, y in the high) places each 256x176 playfield.
# RAM facts from Data Crystal's RAM map (The Legend of Zelda); not yet checked
# against a cartridge.
[game]
system = nes
title = The Legend of Zelda
codes = LEGEND_OF_ZELDA ZELDA ZELDA_NO_DENSETSU

[companion]
note = The map draws itself as Link explores

[hud]
# 0012: 05 normal play, 04-07 the screen scrolling. The picture is 256x224
# (eight rows of overscan off each edge): the bar is its top 56 rows.
on = mem8[0012] == 05
keep = mem8[0012] in 04..07
strip = 0 0 256 56

[view]
format = mosaic
on = mem8[0012] in 04..07
area = mem8[0010]
x = (mem8[00EB] & F) * 100
y = (mem8[00EB] >> 4) * B0 - 40
native = 256 240
crop = 0 64 256 176
# pasted only while nothing scrolls (00E8 is the scroll direction)
when = mem8[0012] == 05 and mem8[00E8] == 00
player_x = (mem8[00EB] & F) * 100 + mem8[0070] + 8
player_y = (mem8[00EB] >> 4) * B0 + mem8[0084] - 35
scale = 8
name.0 = Hyrule
name = Level

[view.status]
alternative = yes
format = board
on = mem8[0012] in 04..07
heading = Link
proper = Link; Triforce
tile1 = Rupees | num 066D 1 icon coin
tile2 = Keys | num 066E 1 icon key
tile3 = Bombs | num 0658 1 icon treasure
tile4 = Triforce | bits 0671 1 of 8 icon star wide
tile5 = Sword | num 0657 1 names icon sword wide
tiers5 = 1 Wooden sword; 2 White sword; 3 Magical sword
