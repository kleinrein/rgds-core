# SCUMM adventures with verbs under the scene (320 x 200: the scene to row 143, then the sentence and verbs and
# inventory): the scene on the top screen, the band large on the touch screen. A finger is the mouse on both panels.
# Known by a file in the game's folder; measured on the Fate of Atlantis demo. ScummVM's own menu is another size:
# then both panels show it whole.
[game]
system = scummvm
title = SCUMM
codes = MONKEY_000 MONKEY1_000 MONKEY2_000 MI2DEMO_000 ATLANTIS_000 PLAYFATE_000 TENTACLE_000 DISK01_LEC

[screens]
pointer = yes
match = 320 200
top = 0 0 320 144
bottom = 0 144 320 56
stretch = 2
