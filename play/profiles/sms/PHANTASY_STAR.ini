# Phantasy Star (Master System). The dungeons are mazes seen in first person
# with no map: the second screen draws each floor as Alis sees it, square by
# square, the stairs and doors marked, and where she stands and faces. Kept
# per floor beside the save; fake walls stay walls until walked through.
# RAM facts from the Phantasy Star disassembly (SMS Power!, maxim-zhao/psrp):
# the floor at CB00 (16x16, the low three bits a square's kind), DungeonPosition
# C30C, DungeonFacingDirection C30B, DungeonNumber C30D, FunctionLookupIndex
# C202 (0B: in a dungeon). Not yet checked against a cartridge.
[game]
system = sms
title = Phantasy Star
codes = PHANTASY_STAR

[companion]
note = The dungeon map draws itself as Alis explores

[view]
format = grid
on = mem8[C202] == 0B
cells = CB00
size = 16 16
position = C30C
facing = C30B
level = mem8[C30D]
type_mask = 07
open = 0
wall = 1 7
up = 2
down = 3
door = 4 5 6
sight = 4
name = Floor

[view.party]
alternative = yes
format = board
on = mem8[C202] == 0B
heading = Party
proper = Alis HP; Myau HP; Odin HP; Noah HP; Meseta
tile1 = Alis HP | num C401 1 icon heart
tile2 = Myau HP | num C411 1 icon heart
tile3 = Odin HP | num C421 1 icon heart
tile4 = Noah HP | num C431 1 icon heart
tile5 = Meseta | num C4E0 2 icon coin wide
