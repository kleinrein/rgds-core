# F-Zero (SNES). A map of the course: the game keeps none, only the machine's
# place on it (the Mode 7 camera follows it), so the first lap draws the road
# and every lap after runs on it, the player blinking on the map. One map per
# course, kept beside the save.
# RAM facts from Data Crystal's RAM map (F-Zero). Checked against a trace
# the handheld kept of Mute City I (28 October 2026): 7E00A2 counts round at
# 8192 and 7E00A6 at 4096, and the course crosses both, so the trace unwraps
# them. Drawn as 7E00A6 across and 7E00A2 upwards, the loop has the shape of
# the game's own minimap (tall, with the step on the right in its lower half).
[game]
system = snes
title = F-Zero
codes = F_ZERO F_ZERO_ FZERO

[companion]
note = The course draws itself on the first lap

[view]
format = trace
# 7E005B: 00 the player drives (not the attract mode's recorded race)
on = mem8[7E005B] == 00
x = mem16[7E00A6]
y = 0 - mem16[7E00A2]
wrap_x = 1000
wrap_y = 2000
# The road about as wide as the game's: two laps on different lines are one road.
width = C0
course = mem8[7E00F2] + mem8[7E0053]
when = mem8[7E005B] == 00
name = Course

[view.status]
alternative = yes
format = board
on = mem8[7E005B] == 00
heading = Race
tile1 = Power | num 7E00C9 2 icon battery wide
tile2 = Minutes | num 7E00C0 1 icon clock
tile3 = Seconds | num 7E00C1 1 icon clock
