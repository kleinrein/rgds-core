# F-Zero (SNES). A map of the course: the game keeps none, only the machine's
# place on it (the Mode 7 camera follows it), so the first lap draws the road
# and every lap after runs on it, the player blinking on the map. One map per
# course, kept beside the save.
# RAM facts from Data Crystal's RAM map (F-Zero); not yet checked against a
# cartridge.
[game]
system = snes
title = F-Zero
codes = F_ZERO F_ZERO_ FZERO

[companion]
note = The course draws itself on the first lap

[view]
format = trace
# 7E005B: 00 the player drives (not the attract mode's recorded race)
on = mem8[7E005B] == 00
x = mem16[7E00A2]
y = mem16[7E00A6]
course = mem8[7E00F2] + mem8[7E0053]
when = mem8[7E005B] == 00
name = Course

[view.status]
alternative = yes
format = board
on = mem8[7E005B] == 00
heading = Race
tile1 = Power | num 7E00C9 2 icon battery wide
tile2 = Minutes | num 7E00C0 1 icon clock
tile3 = Seconds | num 7E00C1 1 icon clock
