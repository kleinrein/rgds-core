# Mario Paint (SNES). Played by touch: the game moves to the touch screen and
# a finger is the SNES Mouse (the core's mouse on the first port). The hand
# goes to where the finger lands, then the left button holds while it stays
# down, so a stroke starts where it is drawn; A is the left button, B the
# right, the D-pad nudges the hand. Checked on the Mac with Mario Paint
# (Europe) through snes9x: the title's gags, a stroke on the canvas, and a
# state kept and loaded in a new run.
[game]
system = snes
title = Mario Paint
codes = MARIO_PAINT MARIOPAINT
mouse = yes
# Where the game keeps its hand: 7E04DC across, 7E04DE down, in the picture's
# pixels (found on the Mac). A count of the mouse moves it a pixel on the
# title and about half one on the canvas: the mouse chases it half the way a
# frame, so either settles.
cursor_x = mem16[7E04DC]
cursor_y = mem16[7E04DE]

[companion]
note = Draw on the touch screen. A clicks, B is the right button
