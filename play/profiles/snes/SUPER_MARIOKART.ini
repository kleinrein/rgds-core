# Super Mario Kart (SNES). The game already has two screens: the race on top,
# the course map (or the rear view) under it. In a race that half moves to the
# second screen, as large as it fits, and the top screen is the race alone,
# as on Mario Kart DS.
# Lap value 7E10C1 from Data Crystal's RAM map (Super Mario Kart: 0-5 laps,
# 127-132 the same, 133 finished). The split, measured on the handheld (a
# race on Mario Circuit, 28 October 2026): the race is rows 0-99, rows
# 100-107 are black, the lower picture is rows 108-223. The top screen keeps
# the race alone and the lower picture fills the second screen's width.
[game]
system = snes
title = Super Mario Kart
codes = SUPER_MARIOKART SUPER_MARIO_KART

[companion]
note = The course map moves here in a race

[hud]
on = mem8[7E10C1] in 7F..84
strip = 0 108 256 116
strip_fill = yes
game_rows = 100
