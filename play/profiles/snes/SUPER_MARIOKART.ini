# Super Mario Kart (SNES). The game already has two screens: the race on top,
# the course map (or the rear view) under it. In a race that half moves to the
# second screen, as large as it fits, and the top screen is the race alone,
# as on Mario Kart DS.
# Lap value 7E10C1 from Data Crystal's RAM map (Super Mario Kart: 0-5 laps,
# 127-132 the same, 133 finished). The split, measured on the handheld (a
# race on Mario Circuit, 28 October 2026): the race is rows 0-99, rows
# 100-107 are black, the lower picture is rows 108-223. The top screen keeps
# the race alone and the lower picture fills the second screen's width.
[game]
system = snes
title = Super Mario Kart
codes = SUPER_MARIOKART SUPER_MARIO_KART

[companion]
note = The course map moves here in a race

[hud]
on = mem8[7E10C1] in 7F..84
strip = 0 108 256 116
strip_fill = yes
game_rows = 100
# Where the core shows its Mode 7 state (our snes9x build, the buildbot's macOS
# one), the race goes on 92 rows further down from the course in video memory:
# 191 rows, the top screen's shape, instead of a 99-row strip.
extend = 92
# The map's sprite table, built in work RAM (the game puts it in OAM between
# the two pictures): the karts and items behind the player stand on that road.
extend_sprites = 7E0420
# The racers' places, which the map shows only to its pixel: X and Y at 7E1017
# and 7E101B (a fraction byte, then the word), one racer every 100 bytes, eight.
extend_places = 7E1017 7E101B 100 8
# Each racer's kart is drawn from tiles of its own, in the same order (180 is
# Mario's): the map sprite drawn from them is that racer.
extend_tiles = 180 184 188 18C 1C0 1C4 1C8 1CC
