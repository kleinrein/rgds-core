# Super Metroid (SNES). The status bar (energy, missiles, super missiles,
# power bombs and the minimap) moves to the second screen, and above it a map
# of everywhere Samus has been, drawn from the game's own picture: each room
# placed by its square on the area map (7E07A1, 7E07A3) and the camera in it
# (7E0911, 7E0915). One map per area, Samus blinking on it.
# RAM facts from P.JBoy's Super Metroid RAM map and Data Crystal; not yet
# checked against a cartridge.
[game]
system = snes
title = Super Metroid
codes = SUPER_METROID

[companion]
note = The map draws itself as Samus explores

[hud]
# 7E0998: 08 the main game
on = mem16[7E0998] == 0008
strip = 0 0 256 32

[view]
format = mosaic
on = mem16[7E0998] == 0008 | 000C | 000D | 000E | 000F | 0010 | 0011 | 0012
area = mem16[7E079F]
x = (mem16[7E07A1] << 8) + mem16[7E0911]
y = (mem16[7E07A3] << 8) + mem16[7E0915]
native = 256 224
crop = 0 32 256 192
when = mem16[7E0998] == 0008
player_x = (mem16[7E07A1] << 8) + mem16[7E0AF6]
player_y = (mem16[7E07A3] << 8) + mem16[7E0AFA]
scale = 8
name.0 = Crateria
name.1 = Brinstar
name.2 = Norfair
name.3 = Wrecked Ship
name.4 = Maridia
name.5 = Tourian
name.6 = Ceres

[view.status]
alternative = yes
format = board
on = mem16[7E0998] == 0008
heading = Samus
tile1 = Energy | num 7E09C2 2 icon heart
tile2 = Reserve | num 7E09D6 2 icon battery
tile3 = Missiles | num 7E09C6 2 icon star
tile4 = Super missiles | num 7E09CA 2 icon star
tile5 = Power bombs | num 7E09CE 2 icon spark
