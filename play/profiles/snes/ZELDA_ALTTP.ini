# The Legend of Zelda: A Link to the Past (SNES). A map of everywhere Link has
# been, drawn from the game's own picture: the Light World and the Dark World
# each as one map, each dungeon as its own, the caves together. The game keeps
# the camera in absolute world pixels (BG2 scroll at 7E00E2, 7E00E8) on the
# overworld and in the dungeons alike, so each frame is pasted where it is.
# RAM facts from the zelda3 reverse engineering and the Hyrule Navigator RAM
# notes (7E0010 module, 7E001B indoors, 7E0020/7E0022 Link, 7E040C dungeon,
# 7E007B the Dark World, 7EF3xx the save); not yet checked against a cartridge.
[game]
system = snes
title = The Legend of Zelda: A Link to the Past
codes = LEGEND_OF_ZELDA ZELDANODENSETSU ZELDA_NO_DENSETSU

[companion]
note = The map draws itself as Link explores

[view]
format = mosaic
# 7E0010: 07 a dungeon or cave, 09 the overworld, 0B the overworld's special areas
on = mem8[7E0010] == 07 | 09 | 0B
# The overworld: 00 Light World, 40 Dark World; inside: 100 + the dungeon (1FF caves and houses)
area = mem8[7E001B] * (100 + mem8[7E040C]) + (1 - mem8[7E001B]) * mem8[7E007B]
x = mem16[7E00E2]
y = mem16[7E00E8]
native = 256 224
# The hearts, magic and items are drawn over the top of the picture
crop = 0 40 256 184
# pasted only while nothing moves between screens (7E0011 is the submodule)
when = mem8[7E0011] == 00
player_x = mem16[7E0022] + 8
player_y = mem16[7E0020] + 12
scale = 8
name.0 = Light World
name.40 = Dark World
name.100 = Sewers
name.102 = Hyrule Castle
name.104 = Eastern Palace
name.106 = Desert Palace
name.108 = Agahnim's Tower
name.10A = Swamp Palace
name.10C = Palace of Darkness
name.10E = Misery Mire
name.110 = Skull Woods
name.112 = Ice Palace
name.114 = Tower of Hera
name.116 = Thieves' Town
name.118 = Turtle Rock
name.11A = Ganon's Tower
name.1FF = Caves and houses

[view.status]
alternative = yes
format = board
on = mem8[7E0010] == 07 | 09 | 0B
heading = Link
proper = Link
tile1 = Hearts | num 7EF36D 1 div 8 icon heart
tile2 = Magic | num 7EF36E 1 of 128 icon spark
tile3 = Rupees | num 7EF360 2 icon coin
tile4 = Bombs | num 7EF343 1 icon treasure
tile5 = Arrows | num 7EF377 1 icon star
tile6 = Keys | num 7EF36F 1 icon key
