# Out Run (ZX Spectrum, U.S. Gold 1988). The road forks at the end of each
# stage, five levels deep, and the game never shows where the forks lead or
# how long each stage took: the second screen is the route, the way driven
# with each stage's time, the stage now with its clock, the two roads ahead,
# and the total.
# Found by RAM search on the 48K tape through Fuse (1 November 2026; no RAM
# map is published): the stage at 8355 (1, then 2 and 3, ... 15: the route's
# stages left to right a level at a time; LOADING asks for it as "WANT 3"),
# the level at 8356 (1-5). The HUD is kept as text (ASCII, the last character
# of a field with its top bit set): the score twice at 821A and 8222 (eight
# characters), the time left at 824A (seconds, then tenths), and LAPTIME's
# three fields of six: the last stage's time at 8232, this stage's clock at
# 8238 and the stages done at 823E. Checked: stage 1's times, then stage 1
# to 2 (the fork to the left) and to 3 (to the right).
[game]
system = zx
title = Out Run
codes = OUT_RUN OUTRUN

[companion]
note = The route: the forks, the way you took and each stage's time

[view]
format = route
# In a race: the sky's dithered band (screen byte 40A0), which the menus never draw.
on = mem8[8356] in 1..5 and mem8[40A0] == FF
stage = mem8[8355]
levels = 5
clock = 8238 6
last = 8232 6
total = 823E 6
