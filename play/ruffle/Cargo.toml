[package]
name = "ruffle_libretro"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Flash games for RG DS Play: Ruffle as a libretro core"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# mimalloc as the allocator: HappyWheels' ActionScript 2.7 ms a frame faster on the RG DS (22.3 -> 19.6 with fat LTO).
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
libc = "0.2"
mimalloc = { version = "0.1", optional = true, default-features = false }
# Ruffle 0.8.0 (2026-11-19). Bump all four together.
ruffle_core = { git = "https://github.com/ruffle-rs/ruffle", tag = "v0.8.0", features = [
    "audio",
    "mp3",
    "aac",
    "nellymoser",
    "lzma",
    "default_compatibility_rules",
    "default_font",
] }
ruffle_render = { git = "https://github.com/ruffle-rs/ruffle", tag = "v0.8.0" }
ruffle_render_wgpu = { git = "https://github.com/ruffle-rs/ruffle", tag = "v0.8.0" }
ruffle_video_software = { git = "https://github.com/ruffle-rs/ruffle", tag = "v0.8.0" }
futures = "0.3.32"
async-channel = "2.5.0"
encoding_rs = "0.8.35"
url = "2.5.8"
percent-encoding = "2.3.2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# The player's GLES context (src/gl.rs): the same glow wgpu-hal uses, so its texture names are ours to blit.
[target.'cfg(target_os = "linux")'.dependencies]
glow = "0.17.0"

[dev-dependencies]

# The headless runner's own GLES context, as the player's (khronos-egl, as wgpu-hal loads it).
[target.'cfg(target_os = "linux")'.dev-dependencies]
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
libloading = "0.8"

[profile.release]
opt-level = 3
# Fat LTO and one unit: Ruffle's ActionScript interpreter is the CPU cost on the RG DS (HappyWheels).
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

# Ruffle's wgpu renderer with a ring of chunk buffers (vendor/ruffle_render_wgpu, see its Cargo.toml), and the rest of
# Ruffle from .cache/ruffle-src: the v0.8.0 tag with patches/*.patch applied (tools/build_ruffle.py makes it, and
# `python3 tools/build_ruffle.py --source` on its own). Every Ruffle crate named anywhere by its git address is listed,
# so the patched core and the renderer share one copy of each.
[patch."https://github.com/ruffle-rs/ruffle"]
ruffle_render_wgpu = { path = "vendor/ruffle_render_wgpu" }
ruffle_core = { path = "../../.cache/ruffle-src/core" }
ruffle_render = { path = "../../.cache/ruffle-src/render" }
ruffle_video_software = { path = "../../.cache/ruffle-src/video/software" }
swf = { path = "../../.cache/ruffle-src/swf" }
naga-agal = { path = "../../.cache/ruffle-src/render/naga-agal" }
naga-pixelbender = { path = "../../.cache/ruffle-src/render/naga-pixelbender" }
