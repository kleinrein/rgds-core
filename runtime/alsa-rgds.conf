# Private to RGDS on the stock RK817 profile. Keep stock capture and controls;
# only playback is shared. Nothing in /etc or the user's home is changed.
</usr/share/alsa/alsa.conf>
!@hooks []
</etc/asound.conf>
pcm.default.playback.!pcm {
    type plug
    slave.pcm {
        type hooks
        slave.pcm {
            type dmix
            ipc_key 1380402259
            ipc_key_add_uid true
            slave {
                pcm "hw:0,0"
                format S16_LE
                rate 48000
                channels 2
                period_size 512
                buffer_size 2048
            }
        }
        hooks.0 {
            type ctl_elems
            # A closing cue must not restore or lock the speaker route while
            # another client (including a stopped emulator) still owns it.
            hook_args [{ name "Playback Path" value "SPK" lock false preserve false }]
        }
    }
}
